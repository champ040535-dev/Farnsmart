<script>
//==== GLOBAL ERROR HANDLING & DEBUG SYSTEM ====
const DEBUG_MODE = true;

}

window.onunhandledrejection = function(event) {

};

//==== CONFIG & ENVIRONMENT ====
const CONFIG = {
  POLL_INTERVAL: 3000,
  LOG_POLL_INTERVAL: 10000,
  TIMER_POLL_INTERVAL: 2000,
  WEATHER_POLL_INTERVAL: 60000,
  MAX_RETRIES: 3,
  RECONNECT_DELAY: 5000,
  LOADING_TIMEOUT: 5000, // Objective 1: Max loading time 5 seconds
  MQTT_HOST: "650188a0ee2b4367b7c131fb385590a9.s1.eu.hivemq.cloud",
  MQTT_WSS_PORT: 8884,
  MQTT_USER: "smartfarm",
  MQTT_PASS: "Kla12345",
  MQTT_DEVICE: "YAT-FARM-001"
};

const TOPIC_STATUS  = "yat/farm/" + CONFIG.MQTT_DEVICE + "/status";
const TOPIC_CONTROL = "yat/farm/" + CONFIG.MQTT_DEVICE + "/control";
const TOPIC_HEALTH  = "yat/farm/" + CONFIG.MQTT_DEVICE + "/health";
const TOPIC_ONLINE  = "yat/farm/" + CONFIG.MQTT_DEVICE + "/online";

// GitHub Pages / HTTPS / Mixed Content Safety Check
const IS_DEMO = window.location.hostname.includes('github.io') || 
                window.location.hostname.includes('base44.app') ||
                (!window.location.origin.includes('192.168.') && 
                 !window.location.origin.includes('localhost') &&
                 !window.location.origin.includes('127.0.0.1') &&
                 !window.location.origin.includes('10.0.'));

let ESP_IP = localStorage.getItem('esp_ip') || '';
let ESP_BASE = (IS_DEMO && ESP_IP) ? ('http://' + ESP_IP) : window.location.origin;

function updateESPBase() {
  if (IS_DEMO && ESP_IP) {
    // Prevent mixed content if dashboard is served via HTTPS
    if (window.location.protocol === 'https:' && ESP_IP.startsWith('http://')) {
      debugLog('Warning: Mixed content blocked prevention activated for local IP over HTTPS');
    }
    ESP_BASE = 'http://' + ESP_IP;
  } else {
    ESP_BASE = window.location.origin;
  }
  localStorage.setItem('esp_ip', ESP_IP);
}

//==== MQTT & OFFLINE QUEUE STATE ====
let mqttClient = null;
let mqttConnected = false;
let commandQueue = [];

//==== MOCK DATA FALLBACKS ====
const MOCK_DATA = {
  pump: false, zone1: false, zone2: false, light: false,
  temperature: 28.5, humidity: 65, soil: 45, soilRaw: 512,
  soilDry: false, soilWet: false,
  mode: 'auto', time: new Date().toLocaleString('th-TH'),
  device: CONFIG.MQTT_DEVICE, firmware: 'V3.5-Stable',
  wifi: true, mqtt: false, rtc: true,
  freeHeap: 35000, uptime: 86400,
  wateringPhase: 0, wateringZone: 0, aiStatus: 'Offline Monitoring'
};

const MOCK_WEATHER = {
  temperature: 30.2, humidity: 68, pressure: 1013,
  windSpeed: 3.5, rain1h: 0, rainProbability: 15,
  description: 'Partly Cloudy (Offline Mode)', lastUpdated: new Date().toISOString(),
  dhtTemp: 28.5, dhtHumidity: 65
};

const MOCK_LOGS = [
  { timestamp: new Date(Date.now()-60000).toISOString(), message: 'System initialized in Safe Mode' },
  { timestamp: new Date(Date.now()-120000).toISOString(), message: 'Network check completed' }
];

const MOCK_OTA = {

};

//==== REACTIVE STATE OBJECT ====
let state = {

  { id: 'ota', label: 'อัพเดท', icon: '⬆️' },
  { id: 'settings', label: 'ตั้งค่า', icon: '🔧' },
];

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

// Sanitization & Security Helper
function sanitizeHTML(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
}

//==== TOAST NOTIFICATIONS ====
function toast(message, type = 'success') {
  const colors = { success: '#4caf50', error: '#f44336', info: '#2196F3', warn: '#ff9800' };
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = '<div class="toast-enter px-5 py-3 rounded-lg shadow-lg text-white font-medium" style="background:' + colors[type] + '">' + sanitizeHTML(message) + '</div>';
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.add('hidden'); }, 3000);
}

//==== SECURE HTTP HELPERS WITH TIMEOUT & RETRY ====
async function espGet(path) {
  if (IS_DEMO && !ESP_IP) {
    if (mqttConnected) return null;
    if (path === '/api/status') return Object.assign({}, state.espData, { time: new Date().toLocaleString('th-TH') });
    if (path === '/api/weather') return MOCK_WEATHER;
    if (path === '/api/logs') return MOCK_LOGS;
    if (path === '/api/timer') return state.timerData;
    if (path === '/api/ota/info') return MOCK_OTA;
    return null;
  }
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(ESP_BASE + path, { method: 'GET', signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (parseErr) {
      debugLog('Invalid JSON from GET ' + path, text);
      return null;
    }
  } catch(e) {
    debugLog('ESP GET ' + path + ' failed:', e.message);
    return null;
  }
}

async function espPost(path, body) {
  // If in MQTT/Demo mode without direct IP, queue or transmit via MQTT
  if (IS_DEMO && !ESP_IP) {
    if (mqttConnected) {
      let cmd = {};
      if (path === '/api/pump') cmd = { pump: body.state };
      else if (path === '/api/zone') { cmd['zone' + body.zone] = body.state; }
      else if (path === '/api/light') cmd = { light: body.state };
      else if (path === '/api/stop') cmd = { stop: true };
      else if (path === '/api/settings') {
        if (body.auto !== undefined) cmd = { auto: body.auto };
        if (body.soilThreshold !== undefined) cmd.soilThreshold = body.soilThreshold;
        if (body.wateringDuration !== undefined) cmd.wateringDuration = body.wateringDuration;
      }
      else if (path === '/api/timer') cmd = { timer: body };
      else if (path === '/api/reboot') cmd = { system: 'restart' };
      else if (path === '/api/resetwifi') cmd = { system: 'reset_wifi' };
      else cmd = body;
      
      const sent = mqttPublish(cmd);
      if (sent) return { status: 'ok' };
    }
    // Fallback simulation response for offline/demo state
    if (path === '/api/stop') return { status: 'stopped' };
    if (path === '/api/pump' || path === '/api/zone' || path === '/api/light') return { status: 'ok' };
    if (path === '/api/settings') return { status: 'ok' };
    if (path === '/api/timer') return body.action === 'start' ? { status: 'started' } : { status: 'stopped' };
    if (path === '/api/reboot') return { status: 'rebooting' };
    if (path === '/api/resetwifi') return { status: 'reset' };
    return { status: 'ok' };
  }

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);
    const res = await fetch(ESP_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    const text = await res.text();
    try { 
      return JSON.parse(text); 
    } catch(e2) { 
      return { status: text }; 
    }
  } catch(e) {
    debugLog('ESP POST ' + path + ' failed:', e.message);
    // Queue command if network request fails and MQTT is available or will be available
    commandQueue.push({ path, body, timestamp: Date.now() });
    return { error: e.message };
  }
}

// Flush Queued Commands upon reconnection
function flushCommandQueue() {
  if (commandQueue.length === 0) return;
  debugLog('Flushing command queue, items:', commandQueue.length);
  while (commandQueue.length > 0) {
    const cmdItem = commandQueue.shift();
    if (mqttConnected) {
      mqttPublish(cmdItem.body);
    } else if (state.espOnline) {
      espPost(cmdItem.path, cmdItem.body);
    }
  }
}

//==== THEME MANAGEMENT ====
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme(); 
  render();
}

function applyTheme() {
  if (state.theme === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}

function timeAgo(ts) {
  if (!ts) return '-';
  const diff = Date.now() - ts;
  if (diff < 60000) return Math.floor(diff/1000) + 's ที่แล้ว';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ที่แล้ว';
  return Math.floor(diff/3600000) + 'h ที่แล้ว';
}

//==== DATA FETCHING & STABILITY ====
async function fetchESPStatus() {
  const data = await espGet('/api/status');
  if (data) {
    state.espData = data;
    state.espOnline = true;
    state.espLastSeen = Date.now();
    state.retryCount = 0;
    state.loading = false;
    
    state.chartHistory.push({
      time: new Date().toLocaleTimeString('th-TH'),
      soil: data.soil || 0,
      temperature: data.temperature || 0,
      humidity: data.humidity || 0,
    });
    if (state.chartHistory.length > 60) state.chartHistory.shift();
    
    if (state.currentPage === 'dashboard') updateDashboardLive();
    flushCommandQueue();
  } else {
    if (state.espOnline) {
      state.espOnline = false;
      toast('ESP8266 ขาดการเชื่อมต่อ (Offline Mode Active)', 'error');
      if (state.currentPage === 'dashboard') updateDashboardLive();
    }
    state.retryCount++;
  }
}

async function fetchESPLogs() {
  if (!state.espOnline && IS_DEMO && !ESP_IP) return;
  const data = await espGet('/api/logs');
  if (data && Array.isArray(data)) {
    state.logs = data.map(function(l){ return { timestamp: l.timestamp, message: l.message }; });
    if (state.currentPage === 'logs') render();
  }
}

async function fetchESPTimer() {
  if (!state.espOnline && !(IS_DEMO && !ESP_IP)) return;
  const data = await espGet('/api/timer');
  if (data) {
    state.timerData = { running: data.running || false, remaining_minutes: data.remaining_minutes || 0 };
    if (state.currentPage === 'dashboard' || state.currentPage === 'automation') render();
  }
}

async function fetchESPWeather() {
  if (!state.espOnline && !(IS_DEMO && !ESP_IP)) return;
  const data = await espGet('/api/weather');
  if (data) {
    state.weatherData = data;
    if (state.currentPage === 'weather' || state.currentPage === 'dashboard') render();
  }
}

async function fetchOTAInfo() {
  const data = await espGet('/api/ota/info');
  if (data) {
    state.otaInfo = data;
    if (state.currentPage === 'ota') render();
  }
}

function updateDashboardLive() { 
  render(); 
  renderCharts(); 
}

//==== MQTT LIFECYCLE & RECONNECT BACKOFF ====
function connectMQTT() {
  if (typeof mqtt === 'undefined') return;
  const url = 'wss://' + CONFIG.MQTT_HOST + ':' + CONFIG.MQTT_WSS_PORT + '/mqtt';
  debugLog('Connecting to MQTT broker:', url);
  try {
    mqttClient = mqtt.connect(url, {
      clientId: 'yat-web-' + Math.random().toString(16).substr(2, 8),
      username: CONFIG.MQTT_USER,
      password: CONFIG.MQTT_PASS,
      clean: true,
      reconnectPeriod: CONFIG.RECONNECT_DELAY,
      connectTimeout: 10000
    });

    mqttClient.on('connect', function() {
      debugLog('MQTT Connected Successfully');
      mqttConnected = true;
      toast('เชื่อมต่อ MQTT สำเร็จ', 'success');
      mqttClient.subscribe([TOPIC_STATUS, TOPIC_HEALTH, TOPIC_ONLINE], function(err) {
        if (!err) {
          mqttClient.publish(TOPIC_CONTROL, JSON.stringify({status: true}));
        }
      });
      flushCommandQueue();
    });

    mqttClient.on('message', function(topic, message) {
      try {
        const data = JSON.parse(message.toString());
        if (topic === TOPIC_STATUS) {
          state.espData = {
            pump: data.pump || false,
            zone1: data.zone1 || false,
            zone2: data.zone2 || false,
            light: data.light || false,
            temperature: data.temperature || 0,
            humidity: data.humidity || 0,
            soil: data.soil || 0,
            soilRaw: data.soilRaw || 0,
            soilDry: data.soilDry || false,
            soilWet: data.soilWet || false,
            mode: data.mode || 'auto',
            time: data.time || 'N/A',
            device: data.device || CONFIG.MQTT_DEVICE,
            firmware: data.firmware || 'V3.5',
            wifi: data.wifi || true,
            mqtt: true,
            rtc: data.rtc || true,
            freeHeap: data.memory || data.heap || 35000,
            uptime: data.uptime || 0,
            wateringPhase: data.wateringPhase || 0,
            wateringZone: data.wateringZone || 0,
            aiStatus: data.aiStatus || 'Active MQTT'
          };
          state.espOnline = true;
          state.espLastSeen = Date.now();
          state.loading = false;
          
          state.chartHistory.push({
            time: new Date().toLocaleTimeString('th-TH'),
            soil: data.soil || 0,
            temperature: data.temperature || 0,
            humidity: data.humidity || 0
          });
          if (state.chartHistory.length > 60) state.chartHistory.shift();
          
          if (state.currentPage === 'dashboard') { render(); renderCharts(); }
          else render();
        } else if (topic === TOPIC_HEALTH) {
          if (state.espData) {
            state.espData.freeHeap = data.heap || state.espData.freeHeap;
            state.espData.wateringPhase = data.wateringPhase || 0;
            state.espData.wateringZone = data.wateringZone || 0;
          }
        } else if (topic === TOPIC_ONLINE) {
          if (data && data.online === false) {
            state.espOnline = false;
            toast('ESP8266 แจ้งสถานะ Offline (LWT)', 'warn');
            render();
          }
        }
      } catch(e) {
        debugLog('MQTT Parse Error:', e);
      }
    });

    mqttClient.on('error', function(err) {
      debugLog('MQTT Error:', err);
    });

    mqttClient.on('close', function() {
      debugLog('MQTT Connection Closed');
      mqttConnected = false;
    });

  } catch(e) {
    debugLog('MQTT Initialization Exception:', e);
  }
}

function mqttPublish(cmd) {
  if (mqttClient && mqttConnected) {
    const payload = JSON.stringify(cmd);
    mqttClient.publish(TOPIC_CONTROL, payload);
    debugLog('MQTT Published:', payload);
    return true;
  }
  // Queue if offline
  commandQueue.push({ path: '/api/control', body: cmd, timestamp: Date.now() });
  return false;
}

function connectESP() {
  const input = document.getElementById('esp-ip-input');
  if (input) ESP_IP = input.value.trim();
  updateESPBase();
  toast('กำลังเชื่อมต่อ ' + sanitizeHTML(ESP_BASE) + '...', 'info');
  state.retryCount = 0;
  state.loading = true;
  fetchESPStatus();
}

  if (IS_DEMO) {

    html += '<div><h3 class="font-bold text-amber-800 dark:text-amber-300">แจ้งเตือน: อุปกรณ์ ESP8266 ไม่ตอบสนอง</h3>';

    html += '<p class="text-xs text-blue-500 mt-1">เวลาคงเหลือ: ' + timerRemaining + ' นาที</p></div>';
    html += '<button onclick="stopTimer()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">หยุด Timer</button></div>';

  // AI & Mode Status
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl p-5 shadow border border-gray-100 dark:border-gray-700">';
  html += '<div class="flex items-center justify-between">';
  html += '<div><span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">AI Assistant Control</span>';
  html += '<p class="text-lg font-bold text-farm mt-1">' + sanitizeHTML(aiStatus) + '</p></div>';
  html += '<div class="text-right text-sm"><span class="text-gray-400">Mode: </span>';
  html += '<span class="font-bold uppercase ' + (mode === 'auto' ? 'text-blue-500' : 'text-orange-500') + '">' + sanitizeHTML(mode) + '</span></div></div>';
  if (wp > 0) html += '<div class="mt-3 text-sm text-farm-accent border-t border-gray-100 dark:border-gray-700 pt-3">Watering Phase: ' + (PHASE_NAMES[wp] || 'Unknown') + ' (Zone ' + wz + ')</div>';
  html += '</div>';

  // Relay Grid Status
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700">';
  html += '<h3 class="font-semibold mb-3 flex items-center gap-2">🔌 สถานะรีเลย์อุปกรณ์</h3>';
  html += '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">';
  html += relayCard('ปั๊มน้ำ', pump, '💧');
  html += relayCard('โซน 1', zone1, '🌿');
  html += relayCard('โซน 2', zone2, '🌿');
  html += relayCard('ไฟสวน', light, '💡');
  html += '</div></div>';

  // Sensor Cards
  html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover border border-gray-100 dark:border-gray-700"><div class="text-3xl mb-1">🌡️</div><div class="text-3xl font-bold text-farm">' + temp.toFixed(1) + '°C</div><div class="text-sm text-gray-500">อุณหภูมิอากาศ</div></div>';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover border border-gray-100 dark:border-gray-700"><div class="text-3xl mb-1">💧</div><div class="text-3xl font-bold text-blue-500">' + Math.round(hum) + '%</div><div class="text-sm text-gray-500">ความชื้นสัมพัทธ์</div></div>';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover border border-gray-100 dark:border-gray-700"><div class="text-3xl mb-1">🌱</div><div class="text-3xl font-bold ' + (soil<35?'text-red-500':soil>60?'text-green-500':'text-yellow-500') + '">' + soil + '%</div><div class="text-sm text-gray-500">ความชื้นดิน</div></div>';
  html += '</div>';

  // Soil Details breakdown
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700">';
  html += '<h3 class="font-semibold mb-3">🌱 รายละเอียดเซ็นเซอร์ความชื้นดิน</h3>';
  html += '<div class="grid grid-cols-3 gap-4 text-center">';
  html += '<div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg"><div class="text-xl font-bold text-gray-700 dark:text-gray-200">' + soilRaw + '</div><div class="text-xs text-gray-400 mt-1">Raw ADC</div></div>';
  html += '<div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg"><div class="text-xl font-bold ' + (soilDry?'text-red-500':'text-gray-400') + '">' + (soilDry?'DRY':'—') + '</div><div class="text-xs text-gray-400 mt-1">ดินแห้ง (&lt;35%)</div></div>';
  html += '<div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg"><div class="text-xl font-bold ' + (soilWet?'text-green-500':'text-gray-400') + '">' + (soilWet?'WET':'—') + '</div><div class="text-xs text-gray-400 mt-1">ดินเปียก (&gt;60%)</div></div>';
  html += '</div></div>';

  // System Diagnostics
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700">';
  html += '<h3 class="font-semibold mb-3 flex items-center gap-2">📡 สถานะการเชื่อมต่อและฮาร์ดแวร์</h3>';
  html += '<div class="flex flex-wrap gap-6 items-center mb-3">';
  html += '<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ' + (wifi?'bg-green-500':'bg-red-500') + '"></span><span class="text-sm">WiFi: ' + (wifi?'Connected':'Disconnected') + '</span></div>';
  html += '<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ' + (mqtt?'bg-green-500':'bg-gray-400') + '"></span><span class="text-sm">MQTT: ' + (mqtt?'Connected':'Disconnected') + '</span></div>';
  html += '<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ' + (rtc?'bg-green-500':'bg-red-500') + '"></span><span class="text-sm">RTC DS3231: ' + (rtc?'OK':'Error') + '</span></div>';
  html += '<div class="text-sm text-gray-400">Heap: ' + (freeHeap > 0 ? (freeHeap/1024).toFixed(1)+'KB' : '-') + '</div>';
  html += '</div>';
  html += '<div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-3 border-t border-gray-100 dark:border-gray-700 text-xs text-gray-500">';
  html += '<div>Uptime: ' + Math.floor(uptime/3600) + 'h ' + Math.floor((uptime%3600)/60) + 'm</div>';
  html += '<div>เวลาอุปกรณ์: ' + sanitizeHTML(time) + '</div>';
  html += '<div>Device ID: ' + sanitizeHTML(device) + '</div>';
  html += '<div>Firmware: ' + sanitizeHTML(firmware) + '</div>';
  html += '</div></div>';

  // Charts Container
  html += '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-4">📈 ความชื้นดินย้อนหลัง (%)</h3><div id="chart-soil" style="width:100%;height:250px"></div></div>';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-4">🌡️ อุณหภูมิและความชื้นอากาศ</h3><div id="chart-temp-humidity" style="width:100%;height:250px"></div></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function relayCard(label, on, icon) {
  return '<div class="rounded-xl p-4 border text-center ' + (on ? 'bg-green-50 dark:bg-green-900/20 border-green-300 dark:border-green-800 text-green-800 dark:text-green-300' : 'bg-gray-50 dark:bg-gray-700/40 border-gray-200 dark:border-gray-700 text-gray-500') + '">' +
    '<div class="text-3xl mb-1">' + icon + '</div>' +
    '<div class="font-bold text-sm">' + label + '</div>' +
    '<div class="text-xs font-semibold mt-1 uppercase tracking-wide ' + (on ? 'text-green-600' : 'text-gray-400') + '">' + (on ? 'ACTIVE (ON)' : 'STANDBY (OFF)') + '</div></div>';
}

function renderControl() {
  const d = state.espData || MOCK_DATA;
  const pump = d.pump;
  const zone1 = d.zone1;
  const zone2 = d.zone2;
  const light = d.light;
  const mode = d.mode || 'auto';
  const soil = d.soil || 0;
  const timerRunning = state.timerData.running;
  const timerRemaining = state.timerData.remaining_minutes;

  let html = '<div class="fade-in space-y-6"><h1 class="text-2xl font-bold">ควบคุมระบบอุปกรณ์</h1>';

  // Stop All Button
  html += '<button onclick="stopAllRelays()" class="stop-btn w-full py-4 bg-red-500 text-white rounded-xl font-bold text-lg hover:bg-red-600 transition flex items-center justify-center gap-2 shadow-lg"><span class="text-2xl">🛑</span> STOP ALL — ปิดระบบฉุกเฉินทั้งหมด</button>';

  // Timer Active Box
  if (timerRunning) {
    html += '<div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl p-4 flex items-center justify-between">';
    html += '<div><span class="text-sm font-medium text-blue-700 dark:text-blue-300">⏱️ Timer กำลังทำงาน</span><p class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">' + timerRemaining + ' นาที</p></div>';
    html += '<button onclick="stopTimer()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">หยุด Timer</button></div>';
  }

  // Operating Mode Switch
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-3">โหมดการทำงานระบบ</h3><div class="flex gap-3">';
  html += '<button onclick="setMode(true)" class="flex-1 py-3 rounded-lg font-bold transition ' + (mode==='auto'?'bg-farm text-white shadow':'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300') + '">AUTO MODE</button>';
  html += '<button onclick="setMode(false)" class="flex-1 py-3 rounded-lg font-bold transition ' + (mode!=='auto'?'bg-orange-500 text-white shadow':'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300') + '">MANUAL MODE</button>';
  html += '</div></div>';

  // Relay Controls with Interlock Protection
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-3">ควบคุมรีเลย์โดยตรง</h3><div class="space-y-3">';
  html += relayToggle('ปั๊มน้ำหลัก (Water Pump)', pump, 'pump', !zone1 && !zone2);
  html += relayToggle('โซนรดน้ำที่ 1 (Zone 1 Valve)', zone1, 'zone1', false);
  html += relayToggle('โซนรดน้ำที่ 2 (Zone 2 Valve)', zone2, 'zone2', false);
  html += relayToggle('ไฟส่องสว่างสวน (Garden Light)', light, 'light', false);
  html += '</div><p class="text-xs text-amber-600 dark:text-amber-400 mt-3">* ระบบความปลอดภัย: ปั๊มน้ำจะไม่สามารถเปิดได้หากไม่มีการเปิดวาล์วโซนใดโซนหนึ่งล่วงหน้า (Interlock Protection)</p></div>';

  // Countdown Timer Config
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-3">ตั้งเวลารดน้ำด่วน (Countdown Timer)</h3>';
  html += '<div class="flex flex-wrap gap-3 items-end">';
  html += '<div class="flex-1 min-w-[140px]"><label class="block text-xs text-gray-400 mb-1">ระยะเวลา (1-120 นาที)</label><input id="timerDuration" type="number" min="1" max="120" value="30" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm"></div>';
  html += '<div class="w-32"><label class="block text-xs text-gray-400 mb-1">เลือกโซน</label><select id="timerZone" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm"><option value="1">Zone 1</option><option value="2">Zone 2</option></select></div>';
  html += '<button onclick="startTimer()" ' + (timerRunning?'disabled':'') + ' class="px-6 py-2 bg-farm text-white rounded-lg font-medium hover:bg-farm-light transition ' + (timerRunning?'opacity-40 cursor-not-allowed':'') + '">เริ่มทำงาน</button>';
  html += '<button onclick="stopTimer()" class="px-5 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 rounded-lg font-medium transition">หยุด</button>';
  html += '</div><p class="text-xs text-gray-400 mt-2">* ลำดับการทำงาน: ระบบจะเปิดวาล์วโซนรอดิน 3 วินาทีก่อนสตาร์ทปั๊มน้ำอัตโนมัติ</p></div>';

  html += '</div>';
  return html;
}

function relayToggle(label, on, device, disabled) {
  return '<div class="flex items-center justify-between p-4 rounded-xl border ' + (on?'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800':'bg-gray-50 dark:bg-gray-700/30 border-gray-200 dark:border-gray-700') + '">' +
    '<div><span class="font-semibold text-sm">' + label + '</span>' + (disabled?'<span class="block text-xs text-amber-500 mt-0.5">(ต้องเปิดวาล์วโซน 1 หรือ 2 ก่อนเปิดปั๊ม)</span>':'') + '</div>' +
    '<button onclick="toggleRelay(\'' + device + '\', ' + !on + ')" ' + (disabled && !on?'disabled':'') +
    ' class="px-6 py-2 rounded-lg font-bold text-sm transition shadow-sm ' + (on?'bg-red-500 hover:bg-red-600 text-white':'bg-green-600 hover:bg-green-700 text-white') + ' ' + (disabled && !on?'opacity-40 cursor-not-allowed':'') + '">' +
    (on?'ปิด (OFF)':'เปิด (ON)') + '</button></div>';
}

    html += '<div class="text-center p-4 rounded-xl bg-gray-50 dark:bg-gray-700/40 border border-gray-100 dark:border-gray-700"><div class="text-3xl mb-1">☔</div><div class="text-2xl font-bold text-blue-500">' + Math.round((w.rainProbability || 0)*100) + '%</div><div class="text-xs text-gray-400 mt-1">โอกาสฝนตก</div></div>';

    html += '</div>';

    // Local DHT11
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 border border-gray-100 dark:border-gray-700"><h3 class="font-semibold mb-3">เซ็นเซอร์ภายในฟาร์ม (DHT11)</h3><div class="grid grid-cols-2 gap-4 text-center">';

function renderLogs() {
  let html = '<div class="fade-in space-y-4">';
  html += '<div class="flex items-center justify-between"><h1 class="text-2xl font-bold">บันทึกเหตุการณ์ระบบ (System Logs)</h1>';
  html += '<button onclick="fetchESPLogs()" class="px-4 py-2 bg-farm text-white rounded-lg text-sm font-medium hover:bg-farm-light transition">รีเฟรช Log</button></div>';
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-4 max-h-[60vh] overflow-y-auto border border-gray-100 dark:border-gray-700 font-mono text-sm">';
  
  if (!state.logs || state.logs.length === 0) {
    html += '<p class="text-gray-400 text-center py-8">ไม่มีบันทึกเหตุการณ์ในระบบ</p>';
  } else {
    state.logs.slice(-50).reverse().forEach(function(l) {
      html += '<div class="border-b border-gray-100 dark:border-gray-700/60 py-2.5 flex items-start gap-3"><span class="text-gray-400 text-xs shrink-0">[' + sanitizeHTML(l.timestamp) + ']</span><span class="text-gray-700 dark:text-gray-300 break-all">' + sanitizeHTML(l.message) + '</span></div>';
    });
  }
  html += '</div></div>';

function onFirmwareSelected(input) {

async function uploadFirmware() {
  if (!state.selectedFile) { toast('กรุณาเลือกไฟล์ .bin ก่อนอัพโหลด', 'error'); return; }
  if (!confirm('ยืนยันการอัพเดตเฟิร์มแวร์ OTA?\nระบบจะรีบูตอุปกรณ์หลังอัพโหลดเสร็จสิ้น')) return;
  
  state.otaUploading = true; 
  state.otaProgress = 0;
  $('#uploadBtn').disabled = true;
  $('#uploadProgressContainer').classList.remove('hidden');
  $('#otaStatus').classList.add('hidden');

  if (IS_DEMO && !ESP_IP) {
    toast('โหมดเดโม: ไม่สามารถอัปโหลดเฟิร์มแวร์จริงได้', 'warn');
    state.otaUploading = false;
    $('#uploadBtn').disabled = false;
    return;
  }

  const xhr = new XMLHttpRequest();
  xhr.open('POST', ESP_BASE + '/api/update', true);
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');
  
  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      state.otaProgress = Math.round(e.loaded / e.total * 100);
      $('#uploadProgressBar').style.width = state.otaProgress + '%';
      $('#uploadProgressText').textContent = state.otaProgress + '%';
    }
  };
  
  xhr.onload = function() {
    state.otaUploading = false;
    if (xhr.status === 200) {
      $('#uploadProgressBar').style.width = '100%';
      $('#uploadProgressText').textContent = '100%';
      const msg = document.createElement('div');
      msg.className = 'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg p-4 text-green-700 dark:text-green-300 text-sm';
      msg.innerHTML = 'อัพโหลดเฟิร์มแวร์สำเร็จ! กำลังรีบูตอุปกรณ์ ESP8266...<br>รอประมาณ 30 วินาทีเพื่อเชื่อมต่อระบบใหม่';
      $('#otaStatus').innerHTML = ''; 
      $('#otaStatus').appendChild(msg); 
      $('#otaStatus').classList.remove('hidden');
      toast('อัพเดตเฟิร์มแวร์สำเร็จ!', 'success');
      
      setTimeout(function() {
        state.espOnline = false; 
        state.loading = true; 
        render();
        const checkInterval = setInterval(function() {
          fetchESPStatus();
          if (state.espOnline) clearInterval(checkInterval);
        }, 3000);
      }, 5000);
    } else {
      const msg2 = document.createElement('div');
      msg2.className = 'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 text-red-700 dark:text-red-300 text-sm';
      msg2.innerHTML = 'อัพโหลดเฟิร์มแวร์ล้มเหลว (HTTP ' + xhr.status + ') กรุณาตรวจสอบไฟล์และลองอีกครั้ง';
      $('#otaStatus').innerHTML = ''; 
      $('#otaStatus').appendChild(msg2); 
      $('#otaStatus').classList.remove('hidden');
      toast('อัพโหลดเฟิร์มแวร์ไม่สำเร็จ', 'error'); 
      $('#uploadBtn').disabled = false;
    }
  };
  
  xhr.onerror = function() {
    state.otaUploading = false;
    toast('เกิดข้อผิดพลาดเครือข่ายระหว่างอัพโหลด', 'error');
    $('#uploadBtn').disabled = false;
  };
  
  xhr.send(state.selectedFile);
  toast('กำลังเริ่มต้นส่งไฟล์เฟิร์มแวร์...', 'info');
}

async function saveSettings() {
  const t = parseInt(($('#soilThreshold') ? $('#soilThreshold').value : 500) || 500);
  const dur = parseInt(($('#wateringDuration') ? $('#wateringDuration').value : 5) || 5);
  const res = await espPost('/api/settings', { soilThreshold: t, wateringDuration: dur });
  if (res && res.status === 'ok') toast('บันทึกการตั้งค่าเรียบร้อย', 'success');
  else toast('บันทึกไม่สำเร็จ: ' + (res && res.error ? res.error : 'Network Error'), 'error');
  fetchESPStatus();
}

async function rebootDevice() {
  if (!confirm('ยืนยันการรีบูตอุปกรณ์ ESP8266?')) return;
  const res = await espPost('/api/reboot', {});
  if (res && res.status === 'rebooting') {

async function toggleRelay(device, turnOn) {
  let res;
  if (device === 'pump') {
    res = await espPost('/api/pump', { state: turnOn });
    if (res && res.error) { toast('Pump Error: ' + res.error, 'error'); return; }
  } else if (device === 'zone1') {
    res = await espPost('/api/zone', { zone: 1, state: turnOn });
    if (res && res.error) { toast('Zone 1 Error: ' + res.error, 'error'); return; }
  } else if (device === 'zone2') {
    res = await espPost('/api/zone', { zone: 2, state: turnOn });
    if (res && res.error) { toast('Zone 2 Error: ' + res.error, 'error'); return; }
  } else if (device === 'light') {
    res = await espPost('/api/light', { state: turnOn });
    if (res && res.error) { toast('Light Error: ' + res.error, 'error'); return; }
  }
  toast(device + ': ' + (turnOn ? 'ON' : 'OFF'), turnOn ? 'success' : 'info');
  fetchESPStatus();
}

  const res = await espPost('/api/settings', { auto: isAuto });

async function startTimer() {
  const dur = parseInt(($('#timerDuration') ? $('#timerDuration').value : 30) || 30);
  const z = parseInt(($('#timerZone') ? $('#timerZone').value : 1) || 1);
  if (dur < 1 || dur > 120) { toast('ระยะเวลาต้องอยู่ระหว่าง 1 ถึง 120 นาที', 'error'); return; }
  const res = await espPost('/api/timer', { action: 'start', duration: dur, zone: z });
  if (res && res.status === 'started') {
    toast('เริ่มจับเวลารดน้ำ ' + dur + ' นาที (Zone ' + z + ')', 'success');
  } else {
    toast('ตั้งเวลาสำเร็จ (ส่งคำสั่งเรียบร้อย)', 'success');
  }
  fetchESPStatus(); 
  fetchESPTimer();
}

async function stopTimer() {

    html += '<button onclick="navigateTo(\'' + item.id + '\')" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 font-medium ' + (state.currentPage===item.id?'active':'') + '"><span class="text-xl">' + item.icon + '</span><span>' + item.label + '</span></button>';

  html += '<button onclick="toggleTheme()" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 font-medium mt-4"><span class="text-xl">' + (state.theme==='dark'?'☀️':'🌙') + '</span><span>' + (state.theme==='dark'?'Light Mode':'Dark Mode') + '</span></button>';
  html += '</aside>';

function toggleSidebar() { 
  state.sidebarOpen = !state.sidebarOpen; 
  render(); 
}

function navigateTo(page) {
  state.currentPage = page; 
  state.sidebarOpen = false; 
  render();
  if (page === 'logs') fetchESPLogs();
  if (page === 'ota') fetchOTAInfo();
  if (page === 'weather') fetchESPWeather();
}

function render() {
  let content = '';
  try {
    switch(state.currentPage) {
      case 'dashboard': content = renderDashboard(); break;
      case 'automation': content = renderControl(); break;
      case 'weather': content = renderWeather(); break;
      case 'logs': content = renderLogs(); break;
      case 'ota': content = renderOTA(); break;
      case 'settings': content = renderSettings(); break;
      default: content = renderDashboard();
    }
  } catch (err) {
    debugLog('Render Exception on page ' + state.currentPage, err);
    content = '<div class="p-6 bg-red-50 dark:bg-red-900/20 text-red-600 rounded-xl">เกิดข้อผิดพลาดในการแสดงผลหน้านี้ ระบบได้ป้องกันแอปพลิเคชันไม่ให้ค้าง</div>';
  }
  
  const appEl = document.getElementById('app');
  if (appEl) appEl.innerHTML = renderLayout(content);
  if (state.currentPage === 'dashboard') {
    setTimeout(renderCharts, 50);
  }
}

//==== INITIALIZATION & TIMEOUT SAFEGUARD (OBJECTIVE 1) ====
applyTheme();

// Safeguard Loading Screen (Max 5 seconds loading timer)
const loadingTimer = setTimeout(function() {
  if (state.loading) {
    debugLog('Loading screen timeout reached (5s). Forcing Dashboard entry in Offline/Safe Mode.');
    state.loading = false;
    state.espOnline = false;
    render();
    const ls = document.getElementById('loading-screen');
    if (ls) {
      ls.style.opacity = '0';
      setTimeout(function(){ ls.style.display = 'none'; }, 500);
    }
  }
}, CONFIG.LOADING_TIMEOUT);

// Initial startup routine
async function initApp() {
  debugLog('Initializing YAT Smart Farm V3.5 Stable');
  
  // Connect MQTT for remote access
  connectMQTT();
  
  // Fetch initial ESP status
  await fetchESPStatus();
  
  // Clear loading screen gracefully
  state.loading = false;
  clearTimeout(loadingTimer);
  
  const ls = document.getElementById('loading-screen');
  if (ls) {
    ls.style.opacity = '0';
    setTimeout(function(){ ls.style.display = 'none'; }, 500);
  }
  
  render();
  
  // Fetch secondary info
  fetchESPLogs();
  fetchESPTimer();
  fetchESPWeather();
  fetchOTAInfo();

  // Setup periodic background polling if valid or fallback enabled
  setInterval(fetchESPStatus, CONFIG.POLL_INTERVAL);
  setInterval(fetchESPLogs, CONFIG.LOG_POLL_INTERVAL);
  setInterval(fetchESPTimer, CONFIG.TIMER_POLL_INTERVAL);
  setInterval(fetchESPWeather, CONFIG.WEATHER_POLL_INTERVAL);
}

// Run application
initApp();
</script>
