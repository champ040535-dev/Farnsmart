<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAT Smart Farm V34 FIXED</title>
    <meta name="theme-color" content="#1b5e20">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/dist/umd/Recharts.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: {
              farm: { DEFAULT: '#1b5e20', light: '#2e7d32', accent: '#4caf50', bg: '#e8f5e9', danger: '#f44336', warn: '#ff9800', info: '#2196F3' }
        } } }
      }
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .fade-in { animation: fadeIn 0.3s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .toast-enter { animation: toastIn 0.3s ease; }
      @keyframes toastIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
      .nav-item { transition: all 0.2s; }
      .nav-item:hover { background: rgba(76,175,80,0.15); }
      .nav-item.active { background: #1b5e20; color: white; }
      .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
      .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
      .pulse-dot { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      input, select { outline: none; }
      input:focus, select:focus { border-color: #1b5e20 !important; box-shadow: 0 0 0 3px rgba(27,94,32,0.1); }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
        .sidebar.open { transform: translateX(0); }
        .mobile-nav { display: flex !important; }
      }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors min-h-screen">
    <div id="app"></div>
    <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>

<script>
// ========== CONFIG ==========
// ESP8266 direct REST API — change to your device IP
// If served FROM the ESP8266 itself, window.location.origin works automatically.
const ESP_BASE = window.location.origin; // ESP8266 serves this page on port 80
const POLL_INTERVAL = 3000; // 3s polling for real-time updates
const BACKEND_BASE = ''; // Optional: Base44 backend URL for cloud features

// ========== STATE ==========
let state = {
  currentPage: 'dashboard',
  user: null,
  theme: localStorage.getItem('theme') || 'light',
  language: 'th',
  espData: null,         // Raw data from ESP8266 /api/status
  espOnline: false,
  espLastSeen: null,
  logs: [],
  automations: [],
  finance: null,
  notifications: [],
  firmware: [],
  settings: null,
  refreshTimer: null,
  chartRange: '24h',
  chartHistory: [],      // Rolling history for charts
  pendingCommands: new Set(), // Prevent duplicate commands
};

// ========== NAV ITEMS ==========
const NAV_ITEMS = [
  { id: 'dashboard', label: 'แดชบอร์ด', icon: '📊', perm: 'view' },
  { id: 'devices', label: 'อุปกรณ์', icon: '📡', perm: 'view' },
  { id: 'automation', label: 'อัตโนมัติ', icon: '⚙️', perm: 'control' },
  { id: 'finance', label: 'การเงิน', icon: '💰', perm: 'view' },
  { id: 'ota', label: 'OTA', icon: '⬆️', perm: 'manage' },
  { id: 'notifications', label: 'แจ้งเตือน', icon: '🔔', perm: 'view' },
  { id: 'logs', label: 'บันทึก', icon: '📋', perm: 'view_logs' },
  { id: 'settings', label: 'ตั้งค่า', icon: '🔧', perm: 'manage' },
];

// ========== UTILITIES ==========
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(message, type = 'success') {
  const colors = { success: '#4caf50', error: '#f44336', info: '#2196F3', warn: '#ff9800' };
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast-enter px-5 py-3 rounded-lg shadow-lg text-white font-medium" style="background:${colors[type]}">${message}</div>`;
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 3000);
}

// Direct REST call to ESP8266
async function espGet(path) {
  try {
    const res = await fetch(`${ESP_BASE}${path}`, { method: 'GET', signal: (() => { const c = new AbortController(); setTimeout(() => c.abort(), 5000); return c.signal; })() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    console.error(`ESP GET ${path}:`, e);
    return null;
  }
}

async function espPost(path, body) {
  try {
    const res = await fetch(`${ESP_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: (() => { const c = new AbortController(); setTimeout(() => c.abort(), 5000); return c.signal; })()
    });
    return await res.json();
  } catch (e) {
    console.error(`ESP POST ${path}:`, e);
    return { error: e.message };
  }
}

// Optional Base44 backend call
async function apiCall(name, method = 'GET', body = null) {
  if (!BACKEND_BASE) return mockBackendResponse(name);
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${BACKEND_BASE}/api/functions/${name}`, opts);
    return await res.json();
  } catch (e) {
    console.error(`API ${name}:`, e);
    return { status: 'error', error: e.message };
  }
}

function mockBackendResponse(name) {
  // Return mock data when no backend is configured
  if (name === 'getDashboardData') return null;
  if (name === 'authApi') return { status: 'ok', role: 'admin', email: 'admin@local' };
  return { status: 'ok' };
}

function formatTime(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('th-TH'); } catch(e) { return iso; }
}

function timeAgo(ts) {
  if (!ts) return '-';
  const diff = Date.now() - ts;
  if (diff < 60000) return `${Math.floor(diff/1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return `${Math.floor(diff/86400000)}d ago`;
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme();
  render();
}

function applyTheme() {
  if (state.theme === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}

// ========== ESP8266 DATA FETCHING ==========
async function fetchESPStatus() {
  const data = await espGet('/api/status');
  if (data) {
    state.espData = data;
    state.espOnline = true;
    state.espLastSeen = Date.now();

    // Build chart history (keep last 60 points = ~3 min at 3s polling)
    state.chartHistory.push({
      time: new Date().toLocaleTimeString('th-TH'),
      soilMoisture: data.soilMoisture || 0,
      temperature: data.weather?.temperature || 0,
      humidity: data.weather?.humidity || 0,
    });
    if (state.chartHistory.length > 60) state.chartHistory.shift();

    // Update UI if on dashboard
    if (state.currentPage === 'dashboard') updateDashboardLive();
  } else {
    if (state.espOnline) {
      state.espOnline = false;
      toast('ESP8266 Offline!', 'error');
      if (state.currentPage === 'dashboard') updateDashboardLive();
    }
  }
}

async function fetchESPLogs() {
  const data = await espGet('/api/logs');
  if (data && Array.isArray(data)) {
    state.logs = data.map((l, i) => ({
      timestamp: l.timestamp,
      type: 'info',
      deviceId: 'YAT-FARM-001',
      message: l.message,
      action: '',
      result: 'success'
    }));
  }
}

// ========== LOGIN ==========
function renderLogin() {
  return `
    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-green-100 to-green-300 dark:from-gray-800 dark:to-gray-900">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
        <div class="text-center mb-8">
          <div class="text-5xl mb-2">🌱</div>
          <h1 class="text-2xl font-bold text-farm">YAT Smart Farm</h1>
          <p class="text-sm text-gray-500">V34 FIXED — Smart Farm Controller</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">อีเมล</label>
            <input id="loginEmail" type="email" placeholder="admin@yatfarm.com"
              class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">รหัสผ่าน</label>
            <input id="loginPassword" type="password" placeholder="••••••••"
              class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
          </div>
          <button onclick="doLogin()" class="w-full py-3 bg-gradient-to-r from-farm to-farm-light text-white rounded-lg font-semibold hover:shadow-lg transition-all">
            เข้าสู่ระบบ
          </button>
          <p class="text-center text-xs text-gray-400">เข้าสู่ระบบด้วยบัญชี ESP8266 หรือคลิกเพื่อเข้าใช้แบบ Demo</p>
          <button onclick="demoLogin()" class="w-full py-2 text-sm text-farm hover:underline">เข้าใช้แบบ Demo (ไม่ต้องล็อกอิน)</button>
        </div>
      </div>
    </div>
  `;
}

async function doLogin() {
  const email = $('#loginEmail')?.value || '';
  const password = $('#loginPassword')?.value || '';
  // Try ESP8266 login first
  const result = await espPost('/api/login', { email, password });
  if (result && result.status === 'ok') {
    state.user = { email, role: result.role || 'admin' };
    localStorage.setItem('user', JSON.stringify(state.user));
    startApp();
  } else {
    // Fallback to demo
    toast('ล็อกอินผ่าน ESP8266 ไม่สำเร็จ — เข้าแบบ Demo', 'warn');
    demoLogin();
  }
}

function demoLogin() {
  state.user = { email: 'demo@local', role: 'admin' };
  localStorage.setItem('user', JSON.stringify(state.user));
  startApp();
}

function doLogout() {
  state.user = null;
  localStorage.removeItem('user');
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  render();
}

function showForgotPassword() {
  toast('ติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน', 'info');
}

// ========== PERMISSIONS ==========
function canAccess(perm) {
  if (!state.user) return false;
  if (state.user.role === 'admin') return true;
  if (state.user.role === 'manager' && (perm === 'view' || perm === 'control' || perm === 'view_logs')) return true;
  if (state.user.role === 'operator' && (perm === 'view' || perm === 'control')) return true;
  if (state.user.role === 'viewer' && perm === 'view') return true;
  return false;
}

// ========== LAYOUT ==========
function renderLayout(content) {
  const navItems = NAV_ITEMS.filter(item => canAccess(item.perm));
  return `
    <div class="flex min-h-screen">
      <div id="sidebar" class="sidebar fixed md:relative w-64 bg-white dark:bg-gray-800 shadow-lg z-30 flex flex-col" style="min-height:100vh">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🌱</span>
            <div>
              <div class="font-bold text-farm">YAT Smart Farm</div>
              <div class="text-xs text-gray-400">V34 FIXED</div>
            </div>
          </div>
        </div>
        <nav class="flex-1 py-2">
          ${navItems.map(item => `
            <button onclick="navigate('${item.id}')" class="nav-item ${state.currentPage === item.id ? 'active' : ''} w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-left">
              <span class="text-lg">${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join('')}
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
          <div class="flex items-center justify-between mb-2">
            <div>
              <div class="text-sm font-medium">${state.user?.email || ''}</div>
              <div class="text-xs text-gray-400 capitalize">${state.user?.role || ''}</div>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-xl">
              ${state.theme === 'dark' ? '☀️' : '🌙'}
            </button>
          </div>
          <div class="flex items-center gap-2 mb-2">
            <span class="w-2 h-2 rounded-full ${state.espOnline ? 'bg-green-500 pulse-dot' : 'bg-red-500'}"></span>
            <span class="text-xs ${state.espOnline ? 'text-green-600' : 'text-red-500'}">${state.espOnline ? 'ESP8266 Online' : 'ESP8266 Offline'}</span>
            ${state.espLastSeen ? `<span class="text-xs text-gray-400">· ${timeAgo(state.espLastSeen)}</span>` : ''}
          </div>
          <button onclick="doLogout()" class="w-full py-2 bg-farm-danger text-white rounded-lg text-sm font-medium hover:opacity-90 transition">ออกจากระบบ</button>
        </div>
      </div>
      <div id="overlay" class="fixed inset-0 bg-black opacity-40 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>
      <div class="flex-1 flex flex-col min-w-0">
        <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-gray-800 shadow-sm">
          <button onclick="toggleSidebar()" class="text-2xl">☰</button>
          <span class="font-bold text-farm">🌱 YAT Smart Farm</span>
          <button onclick="toggleTheme()" class="text-xl">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
        </div>
        <main class="flex-1 p-4 md:p-6 overflow-auto">
          ${content}
        </main>
        <div class="mobile-nav md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 shadow-lg flex justify-around py-2 z-20" style="display:none">
          ${navItems.slice(0,5).map(item => `
            <button onclick="navigate('${item.id}')" class="flex flex-col items-center text-xs ${state.currentPage === item.id ? 'text-farm' : 'text-gray-400'}">
              <span class="text-xl">${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function toggleSidebar() {
  $('#sidebar')?.classList.toggle('open');
  $('#overlay')?.classList.toggle('hidden');
}

function navigate(page) {
  state.currentPage = page;
  if (window.innerWidth < 768) { $('#sidebar')?.classList.remove('open'); $('#overlay')?.classList.add('hidden'); }
  render();
  if (page === 'dashboard') updateDashboardLive();
  else if (page === 'logs') fetchESPLogs().then(() => render());
  else if (page === 'settings') loadSettings();
}

// ========== DASHBOARD ==========
function renderDashboard() {
  const d = state.espData;
  const online = state.espOnline;
  const relays = d ? [
    { name: 'pump', state: d.relay?.pump },
    { name: 'zone1', state: d.relay?.zone1 },
    { name: 'zone2', state: d.relay?.zone2 },
    { name: 'light', state: d.relay?.light }
  ] : [];

  return `
    <div class="fade-in space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">แดชบอร์ด Smart Farm</h1>
          <p class="text-sm text-gray-500">${online ? `อัพเดต: ${timeAgo(state.espLastSeen)}` : 'อุปกรณ์ Offline'}</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1">
            ${['24h','7d','30d'].map(r => `
              <button onclick="state.chartRange='${r}';render()" class="px-3 py-1 rounded-md text-sm font-medium transition ${state.chartRange===r?'bg-farm text-white':'text-gray-600 dark:text-gray-300'}">${r}</button>
            `).join('')}
          </div>
          <div class="flex items-center gap-1 px-3 py-1 rounded-lg ${online?'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300':'bg-red-100 text-red-700'}">
            <span class="w-2 h-2 rounded-full ${online?'bg-green-500 pulse-dot':'bg-red-500'}"></span>
            <span class="text-xs font-medium">${online?'Online':'Offline'}</span>
          </div>
        </div>
      </div>

      ${!online ? `
        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4">
          <h3 class="font-bold text-red-600">⚠️ ไม่สามารถเชื่อมต่อ ESP8266 ได้</h3>
          <p class="text-sm text-red-500">ตรวจสอบว่าอุปกรณ์เปิดอยู่และเชื่อมต่อ WiFi แล้ว ระบบจะพยายามเชื่อมต่อใหม่อัตโนมัติ</p>
        </div>
      ` : ''}

      <!-- Status Cards -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
        ${renderStatCard('ความชื้นดิน', `${d?.soilMoisture ?? 0}`, '🌱', (d?.soilMoisture||0) > (d?.soilThreshold||500) ? 'text-farm' : 'text-yellow-500')}
        ${renderStatCard('เกณฑ์ดิน', `${d?.soilThreshold ?? 500}`, '📊', 'text-farm-info')}
        ${renderStatCard('อุณหภูมิ', `${(d?.weather?.temperature ?? 0).toFixed(1)}°C`, '🌡️', 'text-farm')}
        ${renderStatCard('ความชื้น', `${d?.weather?.humidity ?? 0}%`, '💧', 'text-farm-info')}
        ${renderStatCard('ฝน(1h)', `${d?.weather?.rain1h?.toFixed(1) ?? '0.0'} mm`, '🌧️', (d?.weather?.rain1h||0) > 1 ? 'text-blue-500' : 'text-gray-400')}
        ${renderStatCard('AI Status', d?.ai?.status ?? 'N/A', '🤖', 'text-farm')}
      </div>

      <!-- Relay Status + Timer + Weather -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <h3 class="font-semibold mb-3 flex items-center gap-2">🔌 สถานะรีเลย์</h3>
          <div class="space-y-2">
            ${relays.map(r => `
              <div class="flex items-center justify-between">
                <span class="text-sm">${r.name === 'pump' ? 'ปั๊มน้ำ' : r.name === 'zone1' ? 'โซน 1' : r.name === 'zone2' ? 'โซน 2' : 'ไฟ'}</span>
                <span class="px-3 py-1 rounded-full text-xs font-medium ${r.state ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-gray-100 text-gray-500 dark:bg-gray-700'}">
                  ${r.state ? 'เปิด' : 'ปิด'}
                </span>
              </div>
            `).join('') || '<div class="text-sm text-gray-400">ไม่มีข้อมูล</div>'}
          </div>
          <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-700">
            <div class="flex justify-between text-sm">
              <span class="text-gray-500">โหมด:</span>
              <span class="font-medium ${d?.mode === 'auto' ? 'text-blue-500' : 'text-orange-500'}">${d?.mode === 'auto' ? 'AUTO' : 'MANUAL'}</span>
            </div>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <h3 class="font-semibold mb-3 flex items-center gap-2">⏱️ ตัวจับเวลา</h3>
          <div class="space-y-1 text-sm">
            <div class="flex justify-between"><span class="text-gray-500">สถานะ:</span><span class="font-medium">${d?.timer?.running ? 'กำลังทำงาน' : 'idle'}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">เวลาคงเหลือ:</span><span class="font-medium">${d?.timer?.remainingMinutes ?? 0} นาที</span></div>
            <div class="flex justify-between"><span class="text-gray-500">ระยะเวลา:</span><span class="font-medium">${d?.timer?.duration ?? 0} นาที</span></div>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <h3 class="font-semibold mb-3 flex items-center gap-2">🤖 AI Watering</h3>
          <div class="space-y-1 text-sm">
            <div class="flex justify-between"><span class="text-gray-500">สถานะ:</span><span class="font-medium">${d?.ai?.status ?? 'N/A'}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">การตัดสินใจ:</span><span class="font-medium text-xs">${d?.ai?.lastDecision ?? 'N/A'}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">กำลังรดน้ำ:</span><span class="font-medium">${d?.ai?.active ? 'ใช่' : 'ไม่'}</span></div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
          <h3 class="font-semibold mb-4">📈 ความชื้นดิน (Real-time)</h3>
          <div id="chart-soil" style="width:100%;height:300px"></div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
          <h3 class="font-semibold mb-4">🌡️ อุณหภูมิและความชื้น (Real-time)</h3>
          <div id="chart-temp-humidity" style="width:100%;height:300px"></div>
        </div>
      </div>

      <!-- System Info -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

async function controlDevice(command) {
  const labels = { restart: 'รีสตาร์ท', testRelay: 'ทดสอบรีเลย์', resetWifi: 'รีเซ็ต WiFi' };
  if (!confirm(`สั่ง${labels[command] || command}?`)) return;
  toast(`สั่ง${labels[command] || command}...`, 'info');
  if (command === 'restart') {
    await espPost('/api/reboot', {});
    toast('กำลังรีสตาร์ท...', 'warn');
  } else if (command === 'resetWifi') {
    await espPost('/api/resetwifi', {});
    toast('กำลังรีเซ็ต WiFi...', 'warn');
  } else if (command === 'testRelay') {
    // Send via MQTT command or serial — uses system command via settings
    toast('ทดสอบรีเลย์ — ดูที่อุปกรณ์', 'info');
  }
  setTimeout(() => fetchESPStatus(), 5000);
}

async function quickControl(device, state) {
  const cmdKey = `${device}-${state}`;
  if (state.pendingCommands?.has(cmdKey)) return;
  state.pendingCommands?.add(cmdKey);
  toast(`${device === 'pump' ? 'ปั๊ม' : device === 'zone1' ? 'โซน1' : device === 'zone2' ? 'โซน2' : 'ไฟ'} ${state ? 'เปิด' : 'ปิด'}...`, 'info');

  if (device === 'pump') await espPost('/api/pump', { state });
  else if (device === 'zone1') await espPost('/api/zone', { zone: 1, state });
  else if (device === 'zone2') await espPost('/api/zone', { zone: 2, state });
  else if (device === 'light') {
    // Light has no dedicated endpoint — use settings
    toast('ควบคุมไฟผ่าน MQTT', 'info');
  }

  setTimeout(() => { state.pendingCommands?.delete(cmdKey); fetchESPStatus(); }, 1000);
}

async function setMode(isAuto) {
  await espPost('/api/settings', { auto: isAuto });
  toast(`โหมด ${isAuto ? 'AUTO' : 'MANUAL'}`, isAuto ? 'success' : 'warn');
  fetchESPStatus();
}

async function startTimer() {
  const duration = parseInt($('#timerDuration')?.value || 5);
  if (duration < 1 || duration > 120) { toast('ระยะเวลา 1-120 นาที', 'error'); return; }
  await espPost('/api/timer', { action: 'start', duration });
  toast(`ตั้งเวลา ${duration} นาที`, 'success');
  fetchESPStatus();
}

async function stopTimer() {
  await espPost('/api/timer', { action: 'stop' });
  toast('หยุดตัวจับเวลา', 'info');
  fetchESPStatus();
}

async function emergencyStop() {
  if (!confirm('หยุดทุกระบบทันที?')) return;
  // Turn off all relays and set to manual
  await espPost('/api/pump', { state: false });
  await espPost('/api/zone', { zone: 1, state: false });
  await espPost('/api/zone', { zone: 2, state: false });
  await espPost('/api/settings', { auto: false });
  toast('หยุดฉุกเฉิน — ทุกระบบปิดแล้ว', 'error');
  fetchESPStatus();
}

async function saveAISettings() {
  const threshold = parseInt($('#aiSoilThreshold')?.value || 500);

  await espPost('/api/settings', { soilThreshold: threshold, wateringDuration: duration });

  fetchESPStatus();
}

// ========== MAIN RENDER ==========
function render() {
  const app = $('#app');
  if (!state.user) { app.innerHTML = renderLogin(); return; }

  let content = '';
  switch (state.currentPage) {
    case 'dashboard': content = renderDashboard(); break;
    case 'devices': content = renderDevices(); break;
    case 'automation': content = renderAutomation(); break;
    case 'finance': content = renderFinance(); break;
    case 'ota': content = renderOta(); break;
    case 'notifications': content = renderNotifications(); break;
    case 'logs': content = renderLogs(); break;
    case 'settings': content = renderSettings(); break;
    default: content = renderDashboard();
  }
  app.innerHTML = renderLayout(content);

  // Render charts after DOM update
  if (state.currentPage === 'dashboard') {
    setTimeout(() => renderCharts(), 100);
  }
}

// ========== APP START ==========
function startApp() {
  applyTheme();
  render();
  // Start polling ESP8266 status
  fetchESPStatus();
  fetchESPLogs();
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(() => {
    fetchESPStatus();
    if (state.currentPage === 'logs') fetchESPLogs();
  }, POLL_INTERVAL);
}

// ========== INIT ==========
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  // Auto-login from localStorage
  const saved = localStorage.getItem('user');
  if (saved) {
    try { state.user = JSON.parse(saved); startApp(); } catch(e) { render(); }
  } else {
    render();
  }
});

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
});
</script>
</body>
</html>
