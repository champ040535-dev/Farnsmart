<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAT Smart Farm</title>
    <meta name="theme-color" content="#1b5e20">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/dist/umd/Recharts.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: {
              farm: { DEFAULT: '#1b5e20', light: '#2e7d32', accent: '#4caf50', bg: '#e8f5e9', danger: '#f44336', warn: '#ff9800', info: '#2196F3' }
        } } }
      }
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .fade-in { animation: fadeIn 0.3s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .toast-enter { animation: toastIn 0.3s ease; }
      @keyframes toastIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
      .nav-item { transition: all 0.2s; }
      .nav-item:hover { background: rgba(76,175,80,0.15); }
      .nav-item.active { background: #1b5e20; color: white; }
      .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
      .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
      .pulse-dot { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      input, select { outline: none; }
      input:focus, select:focus { border-color: #1b5e20 !important; box-shadow: 0 0 0 3px rgba(27,94,32,0.1); }
      .stop-btn { animation: stopPulse 1.5s infinite; }
      @keyframes stopPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.4); } 50% { box-shadow: 0 0 0 8px rgba(244,67,54,0); } }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
        .sidebar.open { transform: translateX(0); }
        .mobile-nav { display: flex !important; }
      }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors min-h-screen">
    <div id="app"></div>
    <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>

<script>
const ESP_BASE = window.location.origin;
const POLL_INTERVAL = 3000;

let state = {
  currentPage: 'dashboard',
  user: null,
  theme: localStorage.getItem('theme') || 'light',
  espData: null,
  espOnline: false,
  espLastSeen: null,
  logs: [],
  chartHistory: [],
  pendingCommands: new Set(),
};

const NAV_ITEMS = [
  { id: 'dashboard', label: 'แดชบอร์ด', icon: '📊' },
  { id: 'automation', label: 'ควบคุม', icon: '⚙️' },
  { id: 'logs', label: 'บันทึก', icon: '📋' },
  { id: 'ota', label: 'อัพเดท', icon: '⬆️' },
  { id: 'settings', label: 'ตั้งค่า', icon: '🔧' },
];

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(message, type = 'success') {
  const colors = { success: '#4caf50', error: '#f44336', info: '#2196F3', warn: '#ff9800' };
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast-enter px-5 py-3 rounded-lg shadow-lg text-white font-medium" style="background:${colors[type]}">${message}</div>`;
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 3000);
}

async function espGet(path) {
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 5000);
    const res = await fetch(`${ESP_BASE}${path}`, { method: 'GET', signal: c.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) { console.error(`ESP GET ${path}:`, e); return null; }
}

async function espPost(path, body) {
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 5000);
    const res = await fetch(`${ESP_BASE}${path}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: c.signal
    });
    return await res.json();
  } catch (e) { console.error(`ESP POST ${path}:`, e); return { error: e.message }; }
}

function timeAgo(ts) {
  if (!ts) return '-';
  const diff = Date.now() - ts;
  if (diff < 60000) return `${Math.floor(diff/1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  return `${Math.floor(diff/3600000)}h ago`;
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme(); render();
}
function applyTheme() {
  if (state.theme === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}

// ========== DATA FETCH ==========
async function fetchESPStatus() {
  const data = await espGet('/api/status');
  if (data) {
    state.espData = data;
    state.espOnline = true;
    state.espLastSeen = Date.now();
    state.chartHistory.push({
      time: new Date().toLocaleTimeString('th-TH'),
      soil: data.soil ?? 0,
      temperature: data.temperature ?? 0,
      humidity: data.humidity ?? 0,
    });
    if (state.chartHistory.length > 60) state.chartHistory.shift();
    if (state.currentPage === 'dashboard') updateDashboardLive();
  } else {
    if (state.espOnline) {
      state.espOnline = false;
      toast('ESP8266 Offline!', 'error');
      if (state.currentPage === 'dashboard') updateDashboardLive();
    }
  }
}

async function fetchESPLogs() {
  const data = await espGet('/api/logs');
  if (data && Array.isArray(data)) {
    state.logs = data.map((l) => ({ timestamp: l.timestamp, message: l.message }));
  }
}

// ========== DASHBOARD ==========
function renderDashboard() {
  const d = state.espData;
  const online = state.espOnline;

  // Flat JSON fields (firmware v3.4.2+)
  const pump = d?.pump ?? false;
  const zone1 = d?.zone1 ?? false;
  const zone2 = d?.zone2 ?? false;
  const light = d?.light ?? false;
  const temp = d?.temperature ?? 0;
  const hum = d?.humidity ?? 0;
  const soil = d?.soil ?? 0;
  const wifi = d?.wifi ?? false;
  const mqtt = d?.mqtt ?? false;
  const rtc = d?.rtc ?? false;
  const freeHeap = d?.freeHeap ?? d?.memory ?? 0;
  const uptime = d?.uptime ?? 0;
  const mode = d?.mode ?? 'auto';
  const wp = d?.wateringPhase ?? 0;
  const wz = d?.wateringZone ?? 0;

  const phaseNames = ['Idle','Opening Valve','Pump Running','Pump Off','Closing Valve'];

  return `
    <div class="fade-in space-y-6">
      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">YAT Smart Farm</h1>
          <p class="text-sm text-gray-500">${online ? `อัพเดต: ${timeAgo(state.espLastSeen)}` : 'อุปกรณ์ Offline'}</p>
        </div>
        <div class="flex items-center gap-1 px-3 py-1 rounded-lg ${online?'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300':'bg-red-100 text-red-700'}">
          <span class="w-2 h-2 rounded-full ${online?'bg-green-500 pulse-dot':'bg-red-500'}"></span>
          <span class="text-xs font-medium">${online?'Online':'Offline'}</span>
        </div>
      </div>

      ${!online ? `
        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4">
          <h3 class="font-bold text-red-600">ไม่สามารถเชื่อมต่อ ESP8266 ได้</h3>
          <p class="text-sm text-red-500">ตรวจสอบว่าอุปกรณ์เปิดอยู่และเชื่อมต่อ WiFi แล้ว</p>
        </div>
      ` : ''}

      <!-- STOP ALL Button (Large, Mobile-First) -->
      <button onclick="stopAllRelays()" class="stop-btn w-full py-4 bg-red-500 text-white rounded-xl font-bold text-lg hover:bg-red-600 transition flex items-center justify-center gap-2">
        <span class="text-2xl">🛑</span> STOP ALL — ปิดทุกระบบ
      </button>

      <!-- Relay Status -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3 flex items-center gap-2">🔌 สถานะรีเลย์</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          ${relayCard('Pump', 'ปั๊มน้ำ', pump, '💧')}
          ${relayCard('Zone1', 'โซน 1', zone1, '🌿')}
          ${relayCard('Zone2', 'โซน 2', zone2, '🌿')}
          ${relayCard('Light', 'ไฟสวน', light, '💡')}
        </div>
        <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-700 flex justify-between text-sm">
          <span class="text-gray-500">โหมด:</span>
          <span class="font-medium ${mode === 'auto' ? 'text-blue-500' : 'text-orange-500'}">${mode === 'auto' ? 'AUTO' : 'MANUAL'}</span>
        </div>
        ${wp > 0 ? `<div class="mt-1 text-sm text-farm-accent">Watering: ${phaseNames[wp] || 'Unknown'} (Zone${wz})</div>` : ''}
      </div>

      <!-- Sensors -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <div class="text-3xl mb-1">🌡️</div>
          <div class="text-3xl font-bold text-farm">${temp.toFixed(1)}°C</div>
          <div class="text-sm text-gray-500">อุณหภูมิ</div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <div class="text-3xl mb-1">💧</div>
          <div class="text-3xl font-bold text-blue-500">${Math.round(hum)}%</div>
          <div class="text-sm text-gray-500">ความชื้น</div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <div class="text-3xl mb-1">🌱</div>
          <div class="text-3xl font-bold ${soil < 35 ? 'text-red-500' : soil > 60 ? 'text-green-500' : 'text-yellow-500'}">${soil}%</div>
          <div class="text-sm text-gray-500">ความชื้นดิน ${soil < 35 ? '(แห้ง)' : soil > 60 ? '(ชื้น)' : '(ปกติ)'}</div>
        </div>
      </div>

      <!-- System Info -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3 flex items-center gap-2">📡 ระบบ</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full ${wifi?'bg-green-500':'bg-red-500'}"></span>
            <span class="text-sm">WiFi: ${wifi?'OK':'DOWN'}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full ${mqtt?'bg-green-500':'bg-red-500'}"></span>
            <span class="text-sm">MQTT: ${mqtt?'OK':'DOWN'}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full ${rtc?'bg-green-500':'bg-red-500'}"></span>
            <span class="text-sm">RTC: ${rtc?'OK':'FAIL'}</span>
          </div>
          <div class="text-sm text-gray-500">Memory: ${freeHeap > 0 ? (freeHeap/1024).toFixed(1)+'KB' : '-'}</div>
        </div>
        <div class="mt-2 grid grid-cols-2 gap-3">
          <div class="text-sm text-gray-500">Uptime: ${Math.floor(uptime/3600)}h ${Math.floor((uptime%3600)/60)}m</div>
          <div class="text-sm text-gray-500">เวลา: ${d?.time || 'N/A'}</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
          <h3 class="font-semibold mb-4">📈 ความชื้นดิน (%)</h3>
          <div id="chart-soil" style="width:100%;height:250px"></div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
          <h3 class="font-semibold mb-4">🌡️ อุณหภูมิและความชื้น</h3>
          <div id="chart-temp-humidity" style="width:100%;height:250px"></div>
        </div>
      </div>
    </div>
  `;
}

function relayCard(id, label, on, icon) {
  return `
    <div class="rounded-lg p-3 ${on ? 'bg-green-50 dark:bg-green-900/20 border border-green-300' : 'bg-gray-50 dark:bg-gray-700'}">
      <div class="text-2xl mb-1">${icon}</div>
      <div class="font-medium text-sm">${label}</div>
      <div class="text-xs ${on ? 'text-green-600' : 'text-gray-400'}">${on ? 'ON' : 'OFF'}</div>
    </div>
  `;
}

function updateDashboardLive() { render(); renderCharts(); }

function renderCharts() {
  const history = state.chartHistory || [];
  if (history.length === 0) return;
  const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

  const soilEl = $('#chart-soil');
  if (soilEl) {
    ReactDOM.render(
      React.createElement(ResponsiveContainer, { width: '100%', height: 250 },
        React.createElement(LineChart, { data: history },
          React.createElement(XAxis, { dataKey: 'time', tick: { fontSize: 10 } }),
          React.createElement(YAxis, { domain: [0, 100], tick: { fontSize: 10 } }),
          React.createElement(Tooltip),
          React.createElement(Line, { type: 'monotone', dataKey: 'soil', stroke: '#4caf50', strokeWidth: 2, dot: false })
        )
      ), soilEl
    );
  }

  const tempEl = $('#chart-temp-humidity');
  if (tempEl) {
    ReactDOM.render(
      React.createElement(ResponsiveContainer, { width: '100%', height: 250 },
        React.createElement(LineChart, { data: history },
          React.createElement(XAxis, { dataKey: 'time', tick: { fontSize: 10 } }),
          React.createElement(YAxis, { tick: { fontSize: 10 } }),
          React.createElement(Tooltip),
          React.createElement(Line, { type: 'monotone', dataKey: 'temperature', stroke: '#ff9800', strokeWidth: 2, dot: false }),
          React.createElement(Line, { type: 'monotone', dataKey: 'humidity', stroke: '#2196F3', strokeWidth: 2, dot: false })
        )
      ), tempEl
    );
  }
}

// ========== CONTROL PAGE ==========
function renderControl() {
  const d = state.espData;
  const pump = d?.pump ?? false;
  const zone1 = d?.zone1 ?? false;
  const zone2 = d?.zone2 ?? false;
  const light = d?.light ?? false;
  const mode = d?.mode ?? 'auto';
  const soil = d?.soil ?? 0;

  return `
    <div class="fade-in space-y-6">
      <h1 class="text-2xl font-bold">ควบคุมระบบ</h1>

      <!-- STOP ALL -->
      <button onclick="stopAllRelays()" class="stop-btn w-full py-4 bg-red-500 text-white rounded-xl font-bold text-lg hover:bg-red-600 transition flex items-center justify-center gap-2">
        <span class="text-2xl">🛑</span> STOP ALL — ปิดทุกระบบ
      </button>

      <!-- Mode -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">โหมดการทำงาน</h3>
        <div class="flex gap-3">
          <button onclick="setMode(true)" class="flex-1 py-3 rounded-lg font-medium ${mode==='auto'?'bg-farm text-white':'bg-gray-100 dark:bg-gray-700'}">AUTO</button>
          <button onclick="setMode(false)" class="flex-1 py-3 rounded-lg font-medium ${mode!=='auto'?'bg-orange-500 text-white':'bg-gray-100 dark:bg-gray-700'}">MANUAL</button>
        </div>
      </div>

      <!-- Relay Control -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">ควบคุมรีเลย์</h3>
        <div class="space-y-3">
          ${relayToggle('Pump', 'ปั๊มน้ำ', pump, 'pump', !zone1 && !zone2)}
          ${relayToggle('Zone1', 'โซน 1', zone1, 'zone1', false)}
          ${relayToggle('Zone2', 'โซน 2', zone2, 'zone2', false)}
          ${relayToggle('Light', 'ไฟสวน', light, 'light', false)}
        </div>
        <p class="text-xs text-gray-400 mt-2">* ปั๊มน้ำเปิดไม่ได้ถ้าไม่มี Zone เปิดอยู่</p>
      </div>

      <!-- Timer -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">ตั้งเวลารดน้ำ</h3>
        <div class="flex flex-wrap gap-3 items-end">
          <div>
            <label class="block text-xs text-gray-500 mb-1">ระยะเวลา (นาที)</label>
            <input id="timerDuration" type="number" min="1" max="120" value="30" class="w-24 px-3 py-2 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Zone</label>
            <select id="timerZone" class="px-3 py-2 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
              <option value="1">Zone 1</option>
              <option value="2">Zone 2</option>
            </select>
          </div>
          <button onclick="startTimer()" class="px-5 py-2 bg-farm text-white rounded-lg font-medium hover:bg-farm-light">เริ่ม</button>
          <button onclick="stopTimer()" class="px-5 py-2 bg-gray-300 dark:bg-gray-600 rounded-lg font-medium">หยุด</button>
        </div>
      </div>

      <!-- Soil Status -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">สถานะเซ็นเซอร์</h3>
        <div class="grid grid-cols-3 gap-4 text-center">
          <div><div class="text-2xl font-bold text-farm">${(d?.temperature??0).toFixed(1)}°C</div><div class="text-xs text-gray-500">อุณหภูมิ</div></div>
          <div><div class="text-2xl font-bold text-blue-500">${Math.round(d?.humidity??0)}%</div><div class="text-xs text-gray-500">ความชื้น</div></div>
          <div><div class="text-2xl font-bold ${soil<35?'text-red-500':soil>60?'text-green-500':'text-yellow-500'}">${soil}%</div><div class="text-xs text-gray-500">ดิน</div></div>
        </div>
      </div>
    </div>
  `;
}

function relayToggle(id, label, on, device, disabled) {
  return `
    <div class="flex items-center justify-between p-3 rounded-lg ${on?'bg-green-50 dark:bg-green-900/20':'bg-gray-50 dark:bg-gray-700'}">
      <div>
        <span class="font-medium">${label}</span>
        ${disabled ? '<span class="text-xs text-red-400 ml-2">(ต้องเปิด Zone ก่อน)</span>' : ''}
      </div>
      <button onclick="toggleRelay('${device}', ${!on})" ${disabled && !on ? 'disabled' : ''}
        class="px-6 py-2 rounded-lg font-medium ${on?'bg-red-500 text-white':'bg-green-500 text-white'} ${disabled && !on ? 'opacity-40 cursor-not-allowed' : ''}">
        ${on ? 'OFF' : 'ON'}
      </button>
    </div>
  `;
}

// ========== ACTIONS ==========
async function stopAllRelays() {
  if (!confirm('ยืนยันการปิดทุกระบบ?')) return;
  await espPost('/api/stop', {});
  toast('STOP ALL — ปิดทุกระบบแล้ว', 'error');
  fetchESPStatus();
}

async function toggleRelay(device, state) {
  if (device === 'pump') await espPost('/api/pump', { state });
  else if (device === 'zone1') await espPost('/api/zone', { zone: 1, state });
  else if (device === 'zone2') await espPost('/api/zone', { zone: 2, state });
  else if (device === 'light') await espPost('/api/light', { state });
  fetchESPStatus();
}

async function setMode(isAuto) {
  await espPost('/api/settings', { auto: isAuto });
  fetchESPStatus();
}

async function startTimer() {
  const dur = parseInt($('#timerDuration')?.value || 30);
  const z = parseInt($('#timerZone')?.value || 1);
  await espPost('/api/timer', { action: 'start', duration: dur, zone: z });
  toast(`เริ่มจับเวลา ${dur} นาที (Zone ${z})`, 'success');
  fetchESPStatus();
}

async function stopTimer() {
  await espPost('/api/timer', { action: 'stop' });
  toast('หยุดจับเวลาแล้ว', 'info');
  fetchESPStatus();
}

// ========== LOGS ==========
function renderLogs() {
  return `
    <div class="fade-in space-y-4">
      <h1 class="text-2xl font-bold">บันทึกระบบ</h1>
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-4 max-h-[60vh] overflow-y-auto">
        ${state.logs.length === 0 ? '<p class="text-gray-400 text-center py-4">ไม่มีบันทึก</p>' :
          state.logs.slice(-50).reverse().map(l => `
            <div class="border-b border-gray-100 dark:border-gray-700 py-2 text-sm">
              <span class="text-gray-400">[${l.timestamp}]</span>
              <span class="ml-2">${l.message}</span>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
}

// ========== SETTINGS ==========
// ========== OTA PAGE ==========
let otaInfo = null;
let otaUploading = false;
let otaProgress = 0;

async function fetchOTAInfo() {
  otaInfo = await espGet('/api/ota/info');
  if (state.currentPage === 'ota') render();
}

function renderOTA() {
  const info = otaInfo;
  return `
    <div class="fade-in space-y-6">
      <h1 class="text-2xl font-bold">อัพเดทเฟิร์มแวร์ OTA</h1>

      <!-- Current Firmware Info -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">ข้อมูลเฟิร์มแวร์ปัจจุบัน</h3>
        ${info ? `
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
            <div><span class="text-gray-500">เวอร์ชั่น:</span> <span class="font-medium">${info.firmware || '-'}</span></div>
            <div><span class="text-gray-500">Build:</span> <span class="font-medium">${info.version || '-'}</span></div>
            <div><span class="text-gray-500">อุปกรณ์:</span> <span class="font-medium">${info.device || '-'}</span></div>
            <div><span class="text-gray-500">Chip ID:</span> <span class="font-medium">${info.chipId || '-'}</span></div>
            <div><span class="text-gray-500">Flash:</span> <span class="font-medium">${((info.flashSize||0)/1024/1024).toFixed(1)} MB</span></div>
            <div><span class="text-gray-500">พื้นที่ว่าง:</span> <span class="font-medium">${((info.freeSketchSpace||0)/1024).toFixed(0)} KB</span></div>
          </div>
        ` : '<p class="text-gray-400">กำลังโหลด...</p>'}
      </div>

      <!-- Upload Form -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">อัพโหลดเฟิร์มแวร์ใหม่</h3>

        <div class="space-y-4">
          <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-8 text-center">
            <div class="text-4xl mb-2">📦</div>
            <input type="file" id="firmwareFile" accept=".bin" class="hidden"
              onchange="onFirmwareSelected(this)">
            <button onclick="document.getElementById('firmwareFile').click()"
              class="px-6 py-3 bg-farm text-white rounded-lg font-medium hover:bg-farm-light transition">
              เลือกไฟล์ .bin
            </button>
            <p id="fileName" class="mt-3 text-sm text-gray-500">ยังไม่ได้เลือกไฟล์</p>
          </div>

          <!-- Progress Bar -->
          <div id="uploadProgressContainer" class="hidden">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm font-medium">กำลังอัพโหลด...</span>
              <span id="uploadProgressText" class="text-sm text-gray-500">0%</span>
            </div>
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-4 overflow-hidden">
              <div id="uploadProgressBar" class="bg-farm h-4 rounded-full transition-all duration-300" style="width:0%"></div>
            </div>
          </div>

          <!-- Upload Button -->
          <button id="uploadBtn" onclick="uploadFirmware()" disabled
            class="w-full py-3 bg-green-500 text-white rounded-lg font-bold text-lg hover:bg-green-600 transition disabled:opacity-40 disabled:cursor-not-allowed">
            ⬆️ อัพโหลดเฟิร์มแวร์
          </button>

          <!-- Status Message -->
          <div id="otaStatus" class="hidden"></div>
        </div>
      </div>

      <!-- Instructions -->
      <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl p-5">
        <h3 class="font-semibold mb-2 text-blue-700 dark:text-blue-300">วิธีการอัพเดท</h3>
        <ol class="list-decimal list-inside space-y-1 text-sm text-blue-600 dark:text-blue-400">
          <li>Compile โค้ดใน Arduino IDE (Sketch → Export Compiled Binary)</li>
          <li>หาไฟล์ .bin ในโฟลเดอร์ sketch หรือ Sketch → Show Sketch Folder</li>
          <li>เลือกไฟล์ .bin ที่ได้ แล้วกดอัพโหลด</li>
          <li>รอจนกว่าจะอัพโหลดเสร็จ (ระบบจะรีบูตอัตโนมัติ)</li>
          <li>หลังรีบูต ระบบจะกลับมา Online ภายใน 30 วินาที</li>
        </ol>
        <p class="mt-2 text-xs text-red-500">ห้ามปิดไฟระหว่างอัพโหลด! ระบบจะปิด Relay ทุกตัวก่อนอัพเดท</p>
      </div>
    </div>
  `;
}

let selectedFile = null;

function onFirmwareSelected(input) {
  selectedFile = input.files[0];
  if (selectedFile) {
    $('#fileName').textContent = selectedFile.name + ' (' + (selectedFile.size/1024).toFixed(1) + ' KB)';
    $('#uploadBtn').disabled = false;
    toast('เลือกไฟล์แล้ว: ' + selectedFile.name, 'info');
  }
}

async function uploadFirmware() {
  if (!selectedFile) { toast('กรุณาเลือกไฟล์ .bin ก่อน', 'error'); return; }
  if (!confirm('ยืนยันการอัพเดทเฟิร์มแวร์?\nระบบจะปิดทุก Relay และรีบูตหลังอัพโหลดเสร็จ')) return;

  otaUploading = true;
  otaProgress = 0;
  $('#uploadBtn').disabled = true;
  $('#uploadProgressContainer').classList.remove('hidden');
  $('#otaStatus').classList.add('hidden');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', ESP_BASE + '/api/update', true);
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      otaProgress = Math.round(e.loaded / e.total * 100);
      $('#uploadProgressBar').style.width = otaProgress + '%';
      $('#uploadProgressText').textContent = otaProgress + '%';
    }
  };

  xhr.onload = () => {
    otaUploading = false;
    if (xhr.status === 200) {
      $('#uploadProgressBar').style.width = '100%';
      $('#uploadProgressText').textContent = '100%';
      const msg = document.createElement('div');
      msg.className = 'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg p-4 text-green-700 dark:text-green-300';
      msg.innerHTML = 'อัพโหลดสำเร็จ! กำลังรีบูต ESP8266...<br>รอ 30 วินาทีแล้วระบบจะกลับมา Online';
      $('#otaStatus').innerHTML = '';
      $('#otaStatus').appendChild(msg);
      $('#otaStatus').classList.remove('hidden');
      toast('อัพเดทสำเร็จ! กำลังรีบูต...', 'success');
      // Wait for reboot and reconnect
      setTimeout(() => {
        state.espOnline = false;
        render();
        let retryCount = 0;
        const reconnect = setInterval(() => {
          retryCount++;
          fetchESPStatus();
          if (state.espOnline || retryCount > 20) clearInterval(reconnect);
        }, 2000);
      }, 5000);
    } else {
      const msg = document.createElement('div');
      msg.className = 'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 text-red-700 dark:text-red-300';
      msg.innerHTML = 'อัพโหลดล้มเหลว! (HTTP ' + xhr.status + ')<br>ตรวจสอบไฟล์ .bin และลองอีกครั้ง';
      $('#otaStatus').innerHTML = '';
      $('#otaStatus').appendChild(msg);
      $('#otaStatus').classList.remove('hidden');
      toast('อัพโหลดล้มเหลว!', 'error');
      $('#uploadBtn').disabled = false;
    }
  };

  xhr.onerror = () => {
    otaUploading = false;
    toast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
    $('#uploadBtn').disabled = false;
    // If error during upload, ESP might be restarting — try to reconnect
    if (otaProgress > 80) {
      setTimeout(() => fetchESPStatus(), 10000);
    }
  };

  // Send raw binary
  xhr.send(selectedFile);
  toast('กำลังอัพโหลด ' + (selectedFile.size/1024).toFixed(1) + ' KB...', 'info');
}

function renderSettings() {
  const d = state.espData;
  return `
    <div class="fade-in space-y-4">
      <h1 class="text-2xl font-bold">ตั้งค่า</h1>
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Soil Threshold (raw)</label>
          <input id="soilThreshold" type="number" value="${d?.soilRaw ?? 500}" class="w-full px-3 py-2 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Watering Duration (minutes)</label>
          <input id="wateringDuration" type="number" value="5" class="w-full px-3 py-2 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700">
        </div>
        <button onclick="saveSettings()" class="px-5 py-2 bg-farm text-white rounded-lg font-medium">บันทึก</button>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">
        <h3 class="font-semibold mb-3">ระบบ</h3>
        <button onclick="rebootDevice()" class="px-5 py-2 bg-orange-500 text-white rounded-lg font-medium">รีบูต ESP8266</button>
      </div>
    </div>
  `;
}

async function saveSettings() {
  const t = parseInt($('#soilThreshold')?.value || 500);
  const dur = parseInt($('#wateringDuration')?.value || 5);
  await espPost('/api/settings', { soilThreshold: t, wateringDuration: dur });
  toast('บันทึกการตั้งค่าแล้ว', 'success');
}

async function rebootDevice() {
  if (!confirm('รีบูตอุปกรณ์?')) return;
  await espPost('/api/reboot', {});
  toast('กำลังรีบูต...', 'info');
}

// ========== LAYOUT ==========
function renderLayout(content) {
  return `
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="sidebar fixed md:static w-64 bg-farm text-white p-4 space-y-2 z-30 min-h-screen">
        <div class="mb-6">
          <h2 class="text-xl font-bold">🌴 YAT Smart Farm</h2>
          <p class="text-xs text-green-200">Palm Farm Controller</p>
        </div>
        ${NAV_ITEMS.map(item => `
          <button onclick="navigateTo('${item.id}')" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 ${state.currentPage===item.id?'active':''}">
            <span class="text-xl">${item.icon}</span>
            <span>${item.label}</span>
          </button>
        `).join('')}
        <button onclick="toggleTheme()" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
          <span class="text-xl">${state.theme==='dark'?'☀️':'🌙'}</span>
          <span>${state.theme==='dark'?'Light':'Dark'} Mode</span>
        </button>
      </aside>

      <!-- Main -->
      <main class="flex-1 p-4 md:p-6 max-w-5xl mx-auto">
        ${content}
      </main>
    </div>
  `;
}

function navigateTo(page) { state.currentPage = page; render(); if (page === 'logs') fetchESPLogs(); if (page === 'ota') fetchOTAInfo(); }

// ========== RENDER ==========
function render() {
  let content = '';
  switch(state.currentPage) {
    case 'dashboard': content = renderDashboard(); break;
    case 'automation': content = renderControl(); break;
    case 'logs': content = renderLogs(); break;
    case 'ota': content = renderOTA(); break;
    case 'settings': content = renderSettings(); break;
    default: content = renderDashboard();
  }
  document.getElementById('app').innerHTML = renderLayout(content);
  if (state.currentPage === 'dashboard') renderCharts();
}

// ========== INIT ==========
applyTheme();
render();
fetchESPStatus();
fetchESPLogs();
setInterval(fetchESPStatus, 3000);
setInterval(fetchESPLogs, 10000);
</script>
