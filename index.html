<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAT Smart Farm</title>
    <meta name="theme-color" content="#1b5e20">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/dist/umd/Recharts.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: {
              farm: { DEFAULT: '#1b5e20', light: '#2e7d32', accent: '#4caf50', bg: '#e8f5e9', danger: '#f44336', warn: '#ff9800', info: '#2196F3' }
        } } }
      }
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .fade-in { animation: fadeIn 0.3s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .toast-enter { animation: toastIn 0.3s ease; }
      @keyframes toastIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
      .nav-item { transition: all 0.2s; }
      .nav-item:hover { background: rgba(76,175,80,0.15); }
      .nav-item.active { background: #1b5e20; color: white; }
      .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
      .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
      .pulse-dot { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      input, select { outline: none; }
      input:focus, select:focus { border-color: #1b5e20 !important; box-shadow: 0 0 0 3px rgba(27,94,32,0.1); }
      .stop-btn { animation: stopPulse 1.5s infinite; }
      @keyframes stopPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.4); } 50% { box-shadow: 0 0 0 8px rgba(244,67,54,0); } }
      .spinner { border: 3px solid rgba(76,175,80,0.2); border-top: 3px solid #4caf50; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
        .sidebar.open { transform: translateX(0); }
        .mobile-nav { display: flex !important; }
      }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors min-h-screen">
    <div id="app"></div>
    <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>

<script>
//==== CONFIG ====
const ESP_BASE = window.location.origin;
const POLL_INTERVAL = 3000;
const LOG_POLL_INTERVAL = 10000;
const TIMER_POLL_INTERVAL = 2000;
const WEATHER_POLL_INTERVAL = 60000;
const MAX_RETRIES = 3;
const RECONNECT_DELAY = 5000;

//==== STATE ====
let state = {
  currentPage: 'dashboard',
  user: null,
  theme: localStorage.getItem('theme') || 'light',
  espData: null,
  espOnline: false,
  espLastSeen: null,
  retryCount: 0,
  logs: [],
  chartHistory: [],
  weatherData: null,
  timerData: { running: false, remaining_minutes: 0 },
  otaInfo: null,
  otaUploading: false,
  otaProgress: 0,
  selectedFile: null,
  loading: true,
  sidebarOpen: false,
};

const NAV_ITEMS = [
  { id: 'dashboard', label: 'แดชบอร์ด', icon: '📊' },
  { id: 'automation', label: 'ควบคุม', icon: '⚙️' },
  { id: 'weather', label: 'สภาพอากาศ', icon: '🌤️' },
  { id: 'logs', label: 'บันทึก', icon: '📋' },
  { id: 'ota', label: 'อัพเดท', icon: '⬆️' },
  { id: 'settings', label: 'ตั้งค่า', icon: '🔧' },
];

// Watering phase names (firmware enum WP_IDLE=0..WP_CLOSE_VALVE=4)
const PHASE_NAMES = ['Idle','Opening Valve','Pump Running','Pump Off','Closing Valve'];

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

//==== TOAST ====
function toast(message, type = 'success') {
  const colors = { success: '#4caf50', error: '#f44336', info: '#2196F3', warn: '#ff9800' };
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="toast-enter px-5 py-3 rounded-lg shadow-lg text-white font-medium" style="background:' + colors[type] + '">' + message + '</div>';
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.add('hidden'); }, 3000);
}

//==== HTTP HELPERS ====
async function espGet(path) {
  try {
    var c = new AbortController();
    var t = setTimeout(function(){ c.abort(); }, 5000);
    var res = await fetch(ESP_BASE + path, { method: 'GET', signal: c.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) {
    console.error('ESP GET ' + path + ':', e.message);
    return null;
  }
}

async function espPost(path, body) {
  try {
    var c = new AbortController();
    var t = setTimeout(function(){ c.abort(); }, 8000);
    var res = await fetch(ESP_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: c.signal
    });
    clearTimeout(t);
    var text = await res.text();
    try { return JSON.parse(text); } catch(e2) { return { status: text }; }
  } catch(e) {
    console.error('ESP POST ' + path + ':', e.message);
    return { error: e.message };
  }
}

//==== THEME ====
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme(); render();
}
function applyTheme() {
  if (state.theme === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}

function timeAgo(ts) {
  if (!ts) return '-';
  var diff = Date.now() - ts;
  if (diff < 60000) return Math.floor(diff/1000) + 's ที่แล้ว';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ที่แล้ว';
  return Math.floor(diff/3600000) + 'h ที่แล้ว';
}

//==== DATA FETCH ====
async function fetchESPStatus() {
  var data = await espGet('/api/status');
  if (data) {
    state.espData = data;
    state.espOnline = true;
    state.espLastSeen = Date.now();
    state.retryCount = 0;
    state.loading = false;
    state.chartHistory.push({
      time: new Date().toLocaleTimeString('th-TH'),
      soil: data.soil || 0,
      temperature: data.temperature || 0,
      humidity: data.humidity || 0,
    });
    if (state.chartHistory.length > 60) state.chartHistory.shift();
    if (state.currentPage === 'dashboard') updateDashboardLive();
  } else {
    if (state.espOnline) {
      state.espOnline = false;
      toast('ESP8266 Offline! กำลังพยายามเชื่อมต่อใหม่...', 'error');
      if (state.currentPage === 'dashboard') updateDashboardLive();
    }
    state.retryCount++;
    if (state.retryCount <= MAX_RETRIES && state.currentPage !== 'ota') {
      setTimeout(function(){ fetchESPStatus(); }, RECONNECT_DELAY);
    }
  }
}

async function fetchESPLogs() {
  var data = await espGet('/api/logs');
  if (data && Array.isArray(data)) {
    state.logs = data.map(function(l){ return { timestamp: l.timestamp, message: l.message }; });
    if (state.currentPage === 'logs') render();
  }
}

async function fetchESPTimer() {
  if (!state.espOnline) return;
  var data = await espGet('/api/timer');
  if (data) {
    state.timerData = { running: data.running || false, remaining_minutes: data.remaining_minutes || 0 };
    if (state.currentPage === 'dashboard' || state.currentPage === 'automation') render();
  }
}

async function fetchESPWeather() {
  if (!state.espOnline) return;
  var data = await espGet('/api/weather');
  if (data) {
    state.weatherData = data;
    if (state.currentPage === 'weather' || state.currentPage === 'dashboard') render();
  }
}

async function fetchOTAInfo() {
  var data = await espGet('/api/ota/info');
  if (data) {
    state.otaInfo = data;
    if (state.currentPage === 'ota') render();
  }
}

function updateDashboardLive() { render(); renderCharts(); }

//==== DASHBOARD ====
function renderDashboard() {
  var d = state.espData;
  var online = state.espOnline;
  var pump = d ? d.pump : false;
  var zone1 = d ? d.zone1 : false;
  var zone2 = d ? d.zone2 : false;
  var light = d ? d.light : false;
  var temp = d ? (d.temperature || 0) : 0;
  var hum = d ? (d.humidity || 0) : 0;
  var soil = d ? (d.soil || 0) : 0;
  var soilRaw = d ? (d.soilRaw || 0) : 0;
  var soilDry = d ? (d.soilDry || false) : false;
  var soilWet = d ? (d.soilWet || false) : false;
  var wifi = d ? (d.wifi || false) : false;
  var mqtt = d ? (d.mqtt || false) : false;
  var rtc = d ? (d.rtc || false) : false;
  var freeHeap = d ? (d.freeHeap || 0) : 0;
  var uptime = d ? (d.uptime || 0) : 0;
  var mode = d ? (d.mode || 'auto') : 'auto';
  var wp = d ? (d.wateringPhase || 0) : 0;
  var wz = d ? (d.wateringZone || 0) : 0;
  var aiStatus = d ? (d.aiStatus || 'N/A') : 'N/A';
  var device = d ? (d.device || 'YAT-FARM-001') : 'YAT-FARM-001';
  var firmware = d ? (d.firmware || 'V3.4') : 'V3.4';
  var time = d ? (d.time || 'N/A') : 'N/A';
  var timerRunning = state.timerData.running;
  var timerRemaining = state.timerData.remaining_minutes;

  var html = '<div class="fade-in space-y-6">';
  // Header
  html += '<div class="flex flex-wrap items-center justify-between gap-4">';
  html += '<div><h1 class="text-2xl font-bold">YAT Smart Farm</h1>';
  html += '<p class="text-sm text-gray-500">' + (online ? 'อัพเดต: ' + timeAgo(state.espLastSeen) : 'อุปกรณ์ Offline') + '</p></div>';
  html += '<div class="flex items-center gap-1 px-3 py-1 rounded-lg ' + (online ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-700') + '">';
  html += '<span class="w-2 h-2 rounded-full ' + (online ? 'bg-green-500 pulse-dot' : 'bg-red-500') + '"></span>';
  html += '<span class="text-xs font-medium">' + (online ? 'Online' : 'Offline') + '</span></div></div>';

  // Loading
  if (state.loading) {
    html += '<div class="flex items-center justify-center py-20"><div class="spinner"></div><span class="ml-3 text-gray-500">กำลังโหลด...</span></div>';
  }

  // Offline
  if (!online && !state.loading) {
    html += '<div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4">';
    html += '<h3 class="font-bold text-red-600">ไม่สามารถเชื่อมต่อ ESP8266 ได้</h3>';
    html += '<p class="text-sm text-red-500">ตรวจสอบว่าอุปกรณ์เปิดอยู่และเชื่อมต่อ WiFi แล้ว</p>';
    html += '<p class="text-xs text-red-400 mt-1">พยายามเชื่อมต่อใหม่อัตโนมัติ (ครั้งที่ ' + state.retryCount + '/' + MAX_RETRIES + ')</p>';
    html += '<button onclick="fetchESPStatus()" class="mt-2 px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600">ลองเชื่อมต่อใหม่</button>';
    html += '</div>';
  }

  // Online content
  if (online) {
    // STOP ALL
    html += '<button onclick="stopAllRelays()" class="stop-btn w-full py-4 bg-red-500 text-white rounded-xl font-bold text-lg hover:bg-red-600 transition flex items-center justify-center gap-2"><span class="text-2xl">🛑</span> STOP ALL — ปิดทุกระบบ</button>';

    // Timer Status
    if (timerRunning) {
      html += '<div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl p-4 flex items-center justify-between">';
      html += '<div><span class="text-sm font-medium text-blue-700 dark:text-blue-300">⏱️ กำลังรดน้ำ (Countdown)</span>';
      html += '<p class="text-xs text-blue-500 mt-1">เหลือเวลา ' + timerRemaining + ' นาที</p></div>';
      html += '<button onclick="stopTimer()" class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600">หยุด</button></div>';
    }

    // AI Status
    html += '<div class="bg-farm-bg dark:bg-gray-800 rounded-xl p-4 border border-green-200 dark:border-gray-700">';
    html += '<div class="flex items-center justify-between">';
    html += '<div><span class="text-sm font-medium">🤖 AI Watering Status</span>';
    html += '<p class="text-lg font-bold text-farm mt-1">' + aiStatus + '</p></div>';
    html += '<div class="text-right text-sm"><span class="text-gray-500">Mode: </span>';
    html += '<span class="font-medium ' + (mode === 'auto' ? 'text-blue-500' : 'text-orange-500') + '">' + (mode === 'auto' ? 'AUTO' : 'MANUAL') + '</span></div></div>';
    if (wp > 0) html += '<div class="mt-2 text-sm text-farm-accent border-t border-green-200 dark:border-gray-600 pt-2">Watering Phase: ' + (PHASE_NAMES[wp] || 'Unknown') + ' (Zone ' + wz + ')</div>';
    html += '</div>';

    // Relay Status
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">';
    html += '<h3 class="font-semibold mb-3 flex items-center gap-2">🔌 สถานะรีเลย์</h3>';
    html += '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">';
    html += relayCard('ปั๊มน้ำ', pump, '💧');
    html += relayCard('โซน 1', zone1, '🌿');
    html += relayCard('โซน 2', zone2, '🌿');
    html += relayCard('ไฟสวน', light, '💡');
    html += '</div></div>';

    // Sensors
    html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">';
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover"><div class="text-3xl mb-1">🌡️</div><div class="text-3xl font-bold text-farm">' + temp.toFixed(1) + '°C</div><div class="text-sm text-gray-500">อุณหภูมิ</div></div>';
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover"><div class="text-3xl mb-1">💧</div><div class="text-3xl font-bold text-blue-500">' + Math.round(hum) + '%</div><div class="text-sm text-gray-500">ความชื้นอากาศ</div></div>';
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover"><div class="text-3xl mb-1">🌱</div><div class="text-3xl font-bold ' + (soil<35?'text-red-500':soil>60?'text-green-500':'text-yellow-500') + '">' + soil + '%</div><div class="text-sm text-gray-500">ความชื้นดิน</div></div>';
    html += '</div>';

    // Soil Details
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">';
    html += '<h3 class="font-semibold mb-3">🌱 รายละเอียดเซ็นเซอร์ดิน</h3>';
    html += '<div class="grid grid-cols-3 gap-4 text-center">';
    html += '<div><div class="text-xl font-bold text-gray-700 dark:text-gray-300">' + soilRaw + '</div><div class="text-xs text-gray-500">Raw ADC</div></div>';
    html += '<div><div class="text-xl font-bold ' + (soilDry?'text-red-500':'text-gray-400') + '">' + (soilDry?'DRY':'—') + '</div><div class="text-xs text-gray-500">แห้ง (&lt;35%)</div></div>';
    html += '<div><div class="text-xl font-bold ' + (soilWet?'text-green-500':'text-gray-400') + '">' + (soilWet?'WET':'—') + '</div><div class="text-xs text-gray-500">เปียก (&gt;60%)</div></div>';
    html += '</div></div>';

    // System Status
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">';
    html += '<h3 class="font-semibold mb-3 flex items-center gap-2">📡 สถานะระบบ</h3>';
    html += '<div class="flex flex-wrap gap-4 items-center">';
    html += '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (wifi?'bg-green-500':'bg-red-500') + '"></span><span class="text-sm">WiFi: ' + (wifi?'OK':'DOWN') + '</span></div>';
    html += '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (mqtt?'bg-green-500':'bg-red-500') + '"></span><span class="text-sm">MQTT: ' + (mqtt?'OK':'DOWN') + '</span></div>';
    html += '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ' + (rtc?'bg-green-500':'bg-red-500') + '"></span><span class="text-sm">RTC: ' + (rtc?'OK':'FAIL') + '</span></div>';
    html += '<div class="text-sm text-gray-500">Memory: ' + (freeHeap > 0 ? (freeHeap/1024).toFixed(1)+'KB' : '-') + '</div>';
    html += '</div>';
    html += '<div class="mt-2 grid grid-cols-2 gap-3">';
    html += '<div class="text-sm text-gray-500">Uptime: ' + Math.floor(uptime/3600) + 'h ' + Math.floor((uptime%3600)/60) + 'm</div>';
    html += '<div class="text-sm text-gray-500">เวลา: ' + time + '</div>';
    html += '<div class="text-sm text-gray-500">Device: ' + device + '</div>';
    html += '<div class="text-sm text-gray-500">Firmware: ' + firmware + '</div>';
    html += '</div></div>';

    // Charts
    html += '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">';
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5"><h3 class="font-semibold mb-4">📈 ความชื้นดิน (%)</h3><div id="chart-soil" style="width:100%;height:250px"></div></div>';
    html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5"><h3 class="font-semibold mb-4">🌡️ อุณหภูมิและความชื้น</h3><div id="chart-temp-humidity" style="width:100%;height:250px"></div></div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function relayCard(label, on, icon) {
  return '<div class="rounded-lg p-3 ' + (on ? 'bg-green-50 dark:bg-green-900/20 border border-green-300' : 'bg-gray-50 dark:bg-gray-700') + '">' +
    '<div class="text-2xl mb-1">' + icon + '</div>' +
    '<div class="font-medium text-sm">' + label + '</div>' +
    '<div class="text-xs ' + (on ? 'text-green-600' : 'text-gray-400') + '">' + (on ? 'ON' : 'OFF') + '</div></div>';
}

//==== CONTROL PAGE ====
function renderControl() {
  var d = state.espData;
  var pump = d ? d.pump : false;
  var zone1 = d ? d.zone1 : false;
  var zone2 = d ? d.zone2 : false;
  var light = d ? d.light : false;
  var mode = d ? (d.mode || 'auto') : 'auto';
  var soil = d ? (d.soil || 0) : 0;
  var timerRunning = state.timerData.running;
  var timerRemaining = state.timerData.remaining_minutes;

  var html = '<div class="fade-in space-y-6"><h1 class="text-2xl font-bold">ควบคุมระบบ</h1>';

  // STOP ALL
  html += '<button onclick="stopAllRelays()" class="stop-btn w-full py-4 bg-red-500 text-white rounded-xl font-bold text-lg hover:bg-red-600 transition flex items-center justify-center gap-2"><span class="text-2xl">🛑</span> STOP ALL — ปิดทุกระบบ</button>';

  // Timer Status
  if (timerRunning) {
    html += '<div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl p-4"><div class="flex items-center justify-between">';
    html += '<div><span class="text-sm font-medium text-blue-700 dark:text-blue-300">⏱️ Timer กำลังทำงาน</span><p class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">' + timerRemaining + ' นาที</p></div>';
    html += '<button onclick="stopTimer()" class="px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600">หยุด Timer</button></div></div>';
  }

  // Mode
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5"><h3 class="font-semibold mb-3">โหมดการทำงาน</h3><div class="flex gap-3">';
  html += '<button onclick="setMode(true)" class="flex-1 py-3 rounded-lg font-medium ' + (mode==='auto'?'bg-farm text-white':'bg-gray-100 dark:bg-gray-700') + '">AUTO</button>';
  html += '<button onclick="setMode(false)" class="flex-1 py-3 rounded-lg font-medium ' + (mode!=='auto'?'bg-orange-500 text-white':'bg-gray-100 dark:bg-gray-700') + '">MANUAL</button>';
  html += '</div></div>';

  // Relay Control
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5"><h3 class="font-semibold mb-3">ควบคุมรีเลย์</h3><div class="space-y-3">';
  html += relayToggle('ปั๊มน้ำ', pump, 'pump', !zone1 && !zone2);
  html += relayToggle('โซน 1', zone1, 'zone1', false);
  html += relayToggle('โซน 2', zone2, 'zone2', false);
  html += relayToggle('ไฟสวน', light, 'light', false);
  html += '</div><p class="text-xs text-gray-400 mt-2">* ปั๊มน้ำเปิดไม่ได้ถ้าไม่มี Zone เปิดอยู่ (Pump Interlock)</p></div>';

  // Timer
  html += '<div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5"><h3 class="font-semibold mb-3">ตั้งเวลารดน้ำ (Countdown Timer)</h3>';
  html += '<div class="flex flex-wrap gap-3 items-end">';

//==== ACTIONS ====
async function stopAllRelays() {
  if (!confirm('ยืนยันการปิดทุกระบบ?')) return;
  var res = await espPost('/api/stop', {});
  if (res && res.status === 'stopped') toast('STOP ALL — ปิดทุกระบบแล้ว', 'error');
  else toast('ไม่สามารถหยุดระบบได้', 'error');
  fetchESPStatus();
}

async function toggleRelay(device, turnOn) {
  var res;
  if (device === 'pump') {
    res = await espPost('/api/pump', { state: turnOn });
    if (res && res.error) { toast('Pump: ' + res.error, 'error'); return; }
  } else if (device === 'zone1') {
    res = await espPost('/api/zone', { zone: 1, state: turnOn });
    if (res && res.error) { toast('Zone1: ' + res.error, 'error'); return; }
  } else if (device === 'zone2') {
    res = await espPost('/api/zone', { zone: 2, state: turnOn });
    if (res && res.error) { toast('Zone2: ' + res.error, 'error'); return; }
  } else if (device === 'light') {
    res = await espPost('/api/light', { state: turnOn });
    if (res && res.error) { toast('Light: ' + res.error, 'error'); return; }
  }
  toast(device + ': ' + (turnOn?'ON':'OFF'), turnOn?'success':'info');
  fetchESPStatus();
}

async function setMode(isAuto) {
  var res = await espPost('/api/settings', { auto: isAuto });
  if (res && res.status === 'ok') toast('เปลี่ยนเป็นโหมด ' + (isAuto?'AUTO':'MANUAL'), 'success');
  else toast('เปลี่ยนโหมดไม่สำเร็จ', 'error');
  fetchESPStatus();
}

async function startTimer() {
  var dur = parseInt(($('#timerDuration') ? $('#timerDuration').value : 30) || 30);
  var z = parseInt(($('#timerZone') ? $('#timerZone').value : 1) || 1);
  if (dur < 1 || dur > 120) { toast('ระยะเวลาต้องอยู่ระหว่าง 1-120 นาที', 'error'); return; }
  var res = await espPost('/api/timer', { action: 'start', duration: dur, zone: z });
  if (res && res.status === 'started') toast('เริ่มจับเวลา ' + dur + ' นาที (Zone ' + z + ')', 'success');
  else if (res && res.error) toast(res.error, 'error');
  fetchESPStatus(); fetchESPTimer();
}

async function stopTimer() {
  var res = await espPost('/api/timer', { action: 'stop' });
  if (res && res.status === 'stopped') toast('หยุดจับเวลาแล้ว', 'info');
  else toast('หยุดไม่สำเร็จ', 'error');
  fetchESPStatus(); fetchESPTimer();
}

function onFirmwareSelected(input) {
  state.selectedFile = input.files[0];
  if (state.selectedFile) {
    $('#fileName').textContent = state.selectedFile.name + ' (' + (state.selectedFile.size/1024).toFixed(1) + ' KB)';
    $('#uploadBtn').disabled = false;
    toast('เลือกไฟล์แล้ว: ' + state.selectedFile.name, 'info');
  }
}

async function uploadFirmware() {
  if (!state.selectedFile) { toast('กรุณาเลือกไฟล์ .bin ก่อน', 'error'); return; }
  if (!confirm('ยืนยันการอัพเดทเฟิร์มแวร์?\nระบบจะปิดทุก Relay และรีบูตหลังอัพโหลดเสร็จ')) return;
  state.otaUploading = true; state.otaProgress = 0;
  $('#uploadBtn').disabled = true;
  $('#uploadProgressContainer').classList.remove('hidden');
  $('#otaStatus').classList.add('hidden');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', ESP_BASE + '/api/update', true);
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');
  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      state.otaProgress = Math.round(e.loaded / e.total * 100);
      $('#uploadProgressBar').style.width = state.otaProgress + '%';
      $('#uploadProgressText').textContent = state.otaProgress + '%';
    }
  };
  xhr.onload = function() {
    state.otaUploading = false;
    if (xhr.status === 200) {
      $('#uploadProgressBar').style.width = '100%';
      $('#uploadProgressText').textContent = '100%';
      var msg = document.createElement('div');
      msg.className = 'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg p-4 text-green-700 dark:text-green-300';
      msg.innerHTML = 'อัพโหลดสำเร็จ! กำลังรีบูต ESP8266...<br>รอ 30 วินาทีแล้วระบบจะกลับมา Online';
      $('#otaStatus').innerHTML = ''; $('#otaStatus').appendChild(msg); $('#otaStatus').classList.remove('hidden');
      toast('อัพเดทสำเร็จ! กำลังรีบูต...', 'success');
      setTimeout(function() {
        state.espOnline = false; state.loading = true; render();
        var retryCount = 0;
        var reconnect = setInterval(function() {
          retryCount++; fetchESPStatus();
          if (state.espOnline || retryCount > 20) clearInterval(reconnect);
        }, 2000);
      }, 5000);
    } else {
      var msg2 = document.createElement('div');
      msg2.className = 'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 text-red-700 dark:text-red-300';
      msg2.innerHTML = 'อัพโหลดล้มเหลว! (HTTP ' + xhr.status + ')<br>ตรวจสอบไฟล์ .bin และลองอีกครั้ง';
      $('#otaStatus').innerHTML = ''; $('#otaStatus').appendChild(msg2); $('#otaStatus').classList.remove('hidden');
      toast('อัพโหลดล้มเหลว!', 'error'); $('#uploadBtn').disabled = false;
    }
  };
  xhr.onerror = function() {
    state.otaUploading = false;
    toast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
    $('#uploadBtn').disabled = false;
    if (state.otaProgress > 80) setTimeout(function(){ fetchESPStatus(); }, 10000);
  };
  xhr.send(state.selectedFile);
  toast('กำลังอัพโหลด ' + (state.selectedFile.size/1024).toFixed(1) + ' KB...', 'info');
}

    html += '<div><span class="text-gray-500">Device:</span> <span class="font-medium">' + (d.device||'-') + '</span></div>';
    html += '<div><span class="text-gray-500">Firmware:</span> <span class="font-medium">' + (d.firmware||'-') + '</span></div>';
    html += '<div><span class="text-gray-500">Time:</span> <span class="font-medium">' + (d.time||'-') + '</span></div>';
    html += '<div><span class="text-gray-500">Uptime:</span> <span class="font-medium">' + Math.floor((d.uptime||0)/3600) + 'h ' + Math.floor(((d.uptime||0)%3600)/60) + 'm</span></div>';
    html += '<div><span class="text-gray-500">Free Heap:</span> <span class="font-medium">' + (d.freeHeap?(d.freeHeap/1024).toFixed(1)+'KB':'-') + '</span></div>';
    html += '<div><span class="text-gray-500">Mode:</span> <span class="font-medium">' + (d.mode||'-') + '</span></div>';
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

async function saveSettings() {
  var t = parseInt(($('#soilThreshold') ? $('#soilThreshold').value : 500) || 500);
  var dur = parseInt(($('#wateringDuration') ? $('#wateringDuration').value : 5) || 5);
  var res = await espPost('/api/settings', { soilThreshold: t, wateringDuration: dur });
  if (res && res.status === 'ok') toast('บันทึกการตั้งค่าแล้ว', 'success');
  else toast('บันทึกไม่สำเร็จ: ' + (res&&res.error ? res.error : 'Unknown'), 'error');
  fetchESPStatus();
}

async function rebootDevice() {
  if (!confirm('รีบูตอุปกรณ์?')) return;
  var res = await espPost('/api/reboot', {});
  if (res && res.status === 'rebooting') {
    toast('กำลังรีบูต...', 'info');
    state.espOnline = false; state.loading = true; render();
    setTimeout(function() {
      var retryCount = 0;
      var reconnect = setInterval(function() {
        retryCount++; fetchESPStatus();
        if (state.espOnline || retryCount > 20) clearInterval(reconnect);
      }, 2000);
    }, 5000);
  } else toast('ส่งคำสั่งรีบูตไม่สำเร็จ', 'error');
}

async function resetWiFi() {
  if (!confirm('รีเซ็ต WiFi?\nอุปกรณ์จะล้างการตั้งค่า WiFi และรีบูตเข้า AP Mode (YAT-SmartFarm-AP)')) return;
  var res = await espPost('/api/resetwifi', {});
  if (res && res.status === 'reset') {
    toast('รีเซ็ต WiFi แล้ว กำลังรีบูตเข้า AP Mode...', 'warn');
    state.espOnline = false; state.loading = true; render();
  } else toast('ส่งคำสั่งรีเซ็ตไม่สำเร็จ', 'error');
}

//==== CHARTS ====
function renderCharts() {
  var history = state.chartHistory || [];
  if (history.length === 0) return;
  var RC = Recharts;
  var soilEl = $('#chart-soil');
  if (soilEl) {
    ReactDOM.render(
      React.createElement(RC.ResponsiveContainer, { width: '100%', height: 250 },
        React.createElement(RC.LineChart, { data: history },
          React.createElement(RC.XAxis, { dataKey: 'time', tick: { fontSize: 10 } }),
          React.createElement(RC.YAxis, { domain: [0, 100], tick: { fontSize: 10 } }),
          React.createElement(RC.Tooltip),
          React.createElement(RC.Line, { type: 'monotone', dataKey: 'soil', stroke: '#4caf50', strokeWidth: 2, dot: false })
        )
      ), soilEl
    );
  }
  var tempEl = $('#chart-temp-humidity');
  if (tempEl) {
    ReactDOM.render(
      React.createElement(RC.ResponsiveContainer, { width: '100%', height: 250 },
        React.createElement(RC.LineChart, { data: history },
          React.createElement(RC.XAxis, { dataKey: 'time', tick: { fontSize: 10 } }),
          React.createElement(RC.YAxis, { tick: { fontSize: 10 } }),
          React.createElement(RC.Tooltip),
          React.createElement(RC.Line, { type: 'monotone', dataKey: 'temperature', stroke: '#ff9800', strokeWidth: 2, dot: false }),
          React.createElement(RC.Line, { type: 'monotone', dataKey: 'humidity', stroke: '#2196F3', strokeWidth: 2, dot: false })
        )
      ), tempEl
    );
  }
}

//==== LAYOUT ====
function renderLayout(content) {
  var html = '<div class="flex min-h-screen">';
  // Mobile toggle
  html += '<button onclick="toggleSidebar()" class="mobile-nav md:hidden fixed top-4 left-4 z-40 bg-farm text-white p-2 rounded-lg shadow-lg" style="display:none"><span class="text-xl">☰</span></button>';
  // Sidebar
  html += '<aside class="sidebar fixed md:static w-64 bg-farm text-white p-4 space-y-2 z-30 min-h-screen ' + (state.sidebarOpen ? 'open' : '') + '">';
  html += '<div class="mb-6"><h2 class="text-xl font-bold">🌴 YAT Smart Farm</h2><p class="text-xs text-green-200">Palm Farm Controller</p></div>';
  NAV_ITEMS.forEach(function(item) {
    html += '<button onclick="navigateTo(\'' + item.id + '\')" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 ' + (state.currentPage===item.id?'active':'') + '"><span class="text-xl">' + item.icon + '</span><span>' + item.label + '</span></button>';
  });
  html += '<button onclick="toggleTheme()" class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3"><span class="text-xl">' + (state.theme==='dark'?'☀️':'🌙') + '</span><span>' + (state.theme==='dark'?'Light':'Dark') + ' Mode</span></button>';
  html += '</aside>';
  // Main
  html += '<main class="flex-1 p-4 md:p-6 max-w-5xl mx-auto">' + content + '</main>';
  html += '</div>';
  return html;
}

function toggleSidebar() { state.sidebarOpen = !state.sidebarOpen; render(); }

function navigateTo(page) {
  state.currentPage = page; state.sidebarOpen = false; render();
  if (page === 'logs') fetchESPLogs();
  if (page === 'ota') fetchOTAInfo();
  if (page === 'weather') fetchESPWeather();
}

//==== RENDER ====
function render() {
  var content = '';
  switch(state.currentPage) {
    case 'dashboard': content = renderDashboard(); break;
    case 'automation': content = renderControl(); break;
    case 'weather': content = renderWeather(); break;
    case 'logs': content = renderLogs(); break;
    case 'ota': content = renderOTA(); break;
    case 'settings': content = renderSettings(); break;
    default: content = renderDashboard();
  }
  document.getElementById('app').innerHTML = renderLayout(content);
  if (state.currentPage === 'dashboard') renderCharts();
}

//==== INIT ====
applyTheme();
render();
fetchESPStatus();
fetchESPLogs();
fetchESPTimer();
fetchESPWeather();
setInterval(fetchESPStatus, POLL_INTERVAL);
setInterval(fetchESPLogs, LOG_POLL_INTERVAL);
setInterval(fetchESPTimer, TIMER_POLL_INTERVAL);
setInterval(fetchESPWeather, WEATHER_POLL_INTERVAL);
</script>
</body>
