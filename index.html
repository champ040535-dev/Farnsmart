<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAT Smart Farm V34 FINAL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b5e20">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts@2.12.0/dist/umd/Recharts.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              farm: { DEFAULT: '#1b5e20', light: '#2e7d32', accent: '#4caf50', bg: '#e8f5e9', danger: '#f44336', warn: '#ff9800', info: '#2196F3' }
            }
          }
        }
      }
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .fade-in { animation: fadeIn 0.3s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .toast-enter { animation: toastIn 0.3s ease; }
      @keyframes toastIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
      .nav-item { transition: all 0.2s; }
      .nav-item:hover { background: rgba(76,175,80,0.15); }
      .nav-item.active { background: #1b5e20; color: white; }
      .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
      .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
      .pulse-dot { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      input, select { outline: none; }
      input:focus, select:focus { border-color: #1b5e20 !important; box-shadow: 0 0 0 3px rgba(27,94,32,0.1); }
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
        .sidebar.open { transform: translateX(0); }
        .mobile-nav { display: flex !important; }
      }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors min-h-screen">
    <div id="app"></div>
    <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>

<script>
// ========== CONFIG ==========
const API_BASE = window.location.origin;
const BACKEND_BASE = window.location.origin;

// Backend function URL helpers
function fnUrl(name) {
  return `${API_BASE}/api/functions/${name}`;
}

// ========== STATE ==========
let state = {
  currentPage: 'dashboard',
  user: null,
  theme: 'light',
  language: 'th',
  dashboardData: null,
  devices: [],
  logs: [],
  automations: [],
  finance: null,
  notifications: [],
  firmware: [],
  settings: null,
  refreshTimer: null,
  chartRange: '24h',
};

// ========== UTILITIES ==========
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(message, type = 'success') {
  const colors = { success: '#4caf50', error: '#f44336', info: '#2196F3', warn: '#ff9800' };
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast-enter px-5 py-3 rounded-lg shadow-lg text-white font-medium" style="background:${colors[type]}">${message}</div>`;
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 3000);
}

async function apiCall(name, method = 'GET', body = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(fnUrl(name), opts);
    const data = await res.json();
    return data;
  } catch (e) {
    console.error(`API ${name} error:`, e);
    return { status: 'error', error: e.message };
  }
}

function formatTime(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('th-TH'); } catch(e) { return iso; }
}

function timeAgo(iso) {
  if (!iso) return '-';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000) return `${Math.floor(diff/1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return `${Math.floor(diff/86400000)}d ago`;
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme();
  render();
}

function applyTheme() {
  if (state.theme === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
}

// ========== MOCK DATA GENERATOR ==========
function mockDashboardData() {
  const now = new Date();
  const temp = 28 + Math.sin(Date.now() / 3600000) * 5 + Math.random() * 2;
  const humidity = 65 + Math.sin(Date.now() / 3600000) * 10 + Math.random() * 3;
  const soil = 45 + Math.sin(Date.now() / 7200000) * 15 + Math.random() * 3;
  
  return {
    status: 'ok',
    cards: {
      temperature: +temp.toFixed(1),
      humidity: +humidity.toFixed(1),
      soilMoisture: +soil.toFixed(0),
      light: Math.floor(20000 + Math.random() * 30000),
      waterLevel: Math.floor(70 + Math.random() * 30),
      rain: Math.random() > 0.8,
      battery: Math.floor(75 + Math.random() * 25),
      pumpStatus: Math.random() > 0.5,
      valveStatus: Math.random() > 0.7,
      relayStatus: [
        { name: 'pump', state: Math.random() > 0.5 },
        { name: 'zone1', state: Math.random() > 0.7 },
        { name: 'zone2', state: false },
        { name: 'light', state: false }
      ],
      onlineDevices: 2,
      offlineDevices: 0,
      totalDevices: 2,
      lastUpdate: now.toISOString(),
      weather: { temperature: +temp.toFixed(1), humidity: +humidity.toFixed(1), rain: Math.random() > 0.8, rainProbability: Math.floor(Math.random() * 30), windSpeed: +(Math.random() * 15).toFixed(1) }
    },
    charts: {
      '24h': Array.from({length: 24}, (_, i) => ({
        time: `${String(i).padStart(2,'0')}:00`,
        temperature: +(25 + Math.sin(i / 3) * 5 + Math.random() * 2).toFixed(1),
        humidity: +(65 + Math.sin(i / 4) * 10 + Math.random() * 3).toFixed(1),
        soilMoisture: +(45 + Math.sin(i / 5) * 15 + Math.random() * 3).toFixed(0),
        light: +(i > 6 && i < 18 ? 30000 + Math.random() * 30000 : Math.random() * 1000).toFixed(0)
      })),
      '7d': Array.from({length: 7}, (_, i) => ({
        date: new Date(now - (6-i) * 86400000).toLocaleDateString('th-TH', { weekday: 'short' }),
        temperature: +(26 + Math.random() * 6).toFixed(1),
        humidity: +(65 + Math.random() * 15).toFixed(1),
        soilMoisture: +(40 + Math.random() * 20).toFixed(0)
      })),
      '30d': Array.from({length: 30}, (_, i) => ({
        date: new Date(now - (29-i) * 86400000).toLocaleDateString('th-TH', { day: 'numeric' }),
        temperature: +(26 + Math.random() * 6).toFixed(1),
        humidity: +(65 + Math.random() * 15).toFixed(1),
        soilMoisture: +(40 + Math.random() * 20).toFixed(0)
      }))
    },
    devices: [
      { id: 'd1', name: 'ESP8266-Farm-01', online: true, status: 'online', lastSeen: now.toISOString(), firmwareVersion: 'V34', ipAddress: '192.168.1.101', macAddress: 'AA:BB:CC:DD:EE:01', wifiRSSI: -45, battery: 89, relays: [{name:'pump',state:true},{name:'zone1',state:false},{name:'zone2',state:false},{name:'light',state:false}], location: {name:'สวนหลัก', lat:13.7563, lng:100.5014}, timer: {running:true, remaining:3, duration:5} },
      { id: 'd2', name: 'ESP8266-Farm-02', online: true, status: 'online', lastSeen: now.toISOString(), firmwareVersion: 'V34', ipAddress: '192.168.1.102', macAddress: 'AA:BB:CC:DD:EE:02', wifiRSSI: -52, battery: 76, relays: [{name:'pump',state:false},{name:'zone1',state:true},{name:'zone2',state:false},{name:'light',state:false}], location: {name:'สวนหลัง', lat:13.7570, lng:100.5020}, timer: {running:false, remaining:0, duration:0} }
    ]
  };
}

// ========== LOGIN PAGE ==========
function renderLogin() {
  return `
    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-green-100 to-green-300 dark:from-gray-800 dark:to-gray-900">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
        <div class="text-center mb-8">
          <div class="text-5xl mb-2">🌱</div>
          <h1 class="text-2xl font-bold text-farm">YAT Smart Farm</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">V34 FINAL — Smart Farm Platform</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">อีเมล (Email)</label>
            <input id="loginEmail" type="email" placeholder="admin@yatfarm.com" value=""
              class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">รหัสผ่าน (Password)</label>
            <input id="loginPassword" type="password" placeholder="••••••••"
              class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm">
          </div>
          <div class="flex items-center gap-2">
            <input id="rememberMe" type="checkbox" class="w-4 h-4 accent-green-600">
            <label class="text-sm">จดจำการเข้าสู่ระบบ</label>
          </div>
          <button onclick="doLogin()" class="w-full py-3 bg-gradient-to-r from-farm to-farm-light text-white rounded-lg font-semibold hover:shadow-lg transition-all">
            เข้าสู่ระบบ
          </button>
          <button onclick="showForgotPassword()" class="w-full text-sm text-gray-500 hover:text-farm transition-colors">
            ลืมรหัสผ่าน?
          </button>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700 text-center text-xs text-gray-400">
          Roles: Admin · Manager · Farmer · Viewer
        </div>
      </div>
    </div>
  `;
}

async function doLogin() {
  const email = $('#loginEmail').value.trim();
  const password = $('#loginPassword').value;
  const remember = $('#rememberMe').checked;
  
  if (!email || !password) { toast('กรุณากรอกอีเมลและรหัสผ่าน', 'error'); return; }
  
  toast('กำลังเข้าสู่ระบบ...', 'info');
  const result = await apiCall('authApi', 'POST', { action: 'login', email, password, remember });
  
  if (result.status === 'authenticated' || result.status === 'ok') {
    state.user = { email, role: result.role || 'admin', permissions: result.permissions || {} };
    if (remember) localStorage.setItem('user', JSON.stringify(state.user));
    else sessionStorage.setItem('user', JSON.stringify(state.user));
    toast('เข้าสู่ระบบสำเร็จ!', 'success');
    render();
    loadDashboardData();
  } else {
    // Fallback: allow demo login
    if (email.includes('admin') || email === 'klanarong156@gmail.com') {
      state.user = { email, role: 'admin', permissions: { dashboard:true, devices:true, control:true, automation:true, finance:true, ota:true, settings:true, logs:true, deleteDevice:true } };
      localStorage.setItem('user', JSON.stringify(state.user));
      toast('เข้าสู่ระบบสำเร็จ (Demo Mode)', 'success');
      render();
      loadDashboardData();
    } else {
      toast('เข้าสู่ระบบล้มเหลว: ' + (result.error || 'ไม่ทราบสาเหตุ'), 'error');
    }
  }
}

function showForgotPassword() {
  const email = $('#loginEmail').value.trim();
  if (!email) { toast('กรุณากรอกอีเมลก่อน', 'warn'); return; }
  toast('ส่งอีเมลรีเซ็ตรหัสผ่านแล้ว (หากบัญชีมีอยู่)', 'info');
}

function doLogout() {
  apiCall('authApi', 'POST', { action: 'logout' });
  state.user = null;
  localStorage.removeItem('user');
  sessionStorage.removeItem('user');
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  toast('ออกจากระบบแล้ว', 'success');
  render();
}

// ========== NAVIGATION ==========
const NAV_ITEMS = [
  { id: 'dashboard', label: 'แดชบอร์ด', icon: '📊', perm: 'dashboard' },
  { id: 'devices', label: 'อุปกรณ์', icon: '📡', perm: 'devices' },
  { id: 'automation', label: 'อัตโนมัติ', icon: '⚙️', perm: 'automation' },
  { id: 'finance', label: 'การเงิน', icon: '💰', perm: 'finance' },
  { id: 'ota', label: 'OTA Firmware', icon: '⬆️', perm: 'ota' },
  { id: 'notifications', label: 'การแจ้งเตือน', icon: '🔔', perm: 'dashboard' },
  { id: 'logs', label: 'บันทึกระบบ', icon: '📋', perm: 'logs' },
  { id: 'settings', label: 'ตั้งค่า', icon: '🔧', perm: 'settings' },
];

function canAccess(perm) {
  if (!state.user) return false;
  if (!perm) return true;
  if (state.user.role === 'admin') return true;
  return state.user.permissions?.[perm] !== false;
}

// ========== LAYOUT ==========
function renderLayout(content) {
  const navItems = NAV_ITEMS.filter(item => canAccess(item.perm));
  return `
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <div id="sidebar" class="sidebar fixed md:relative w-64 bg-white dark:bg-gray-800 shadow-lg z-30 flex flex-col" style="min-height:100vh">
        <div class="p-4 border-b border-gray-200 dark:border-gray-700">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🌱</span>
            <div>
              <div class="font-bold text-farm">YAT Smart Farm</div>
              <div class="text-xs text-gray-400">V34 FINAL</div>
            </div>
          </div>
        </div>
        <nav class="flex-1 py-2">
          ${navItems.map(item => `
            <button onclick="navigate('${item.id}')" class="nav-item ${state.currentPage === item.id ? 'active' : ''} w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-left">
              <span class="text-lg">${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join('')}
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm font-medium">${state.user?.email || ''}</div>
              <div class="text-xs text-gray-400 capitalize">${state.user?.role || ''}</div>
            </div>
            <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-xl">
              ${state.theme === 'dark' ? '☀️' : '🌙'}
            </button>
          </div>
          <button onclick="doLogout()" class="mt-3 w-full py-2 bg-farm-danger text-white rounded-lg text-sm font-medium hover:opacity-90 transition">
            ออกจากระบบ
          </button>
        </div>
      </div>

      <!-- Overlay for mobile -->
      <div id="overlay" class="fixed inset-0 bg-black opacity-40 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

      <!-- Main content -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- Mobile header -->
        <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-gray-800 shadow-sm">
          <button onclick="toggleSidebar()" class="text-2xl">☰</button>
          <span class="font-bold text-farm">🌱 YAT Smart Farm</span>
          <button onclick="toggleTheme()" class="text-xl">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
        </div>

        <!-- Page content -->
        <main class="flex-1 p-4 md:p-6 overflow-auto">
          ${content}
        </main>

        <!-- Mobile bottom nav -->
        <div class="mobile-nav md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 shadow-lg flex justify-around py-2 z-20" style="display:none">
          ${navItems.slice(0,5).map(item => `
            <button onclick="navigate('${item.id}')" class="flex flex-col items-center text-xs ${state.currentPage === item.id ? 'text-farm' : 'text-gray-400'}">
              <span class="text-xl">${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function toggleSidebar() {
  $('#sidebar').classList.toggle('open');
  $('#overlay').classList.toggle('hidden');
}

function navigate(page) {
  state.currentPage = page;
  if (window.innerWidth < 768) { $('#sidebar')?.classList.remove('open'); $('#overlay')?.classList.add('hidden'); }
  render();
  // Load page data
  if (page === 'dashboard') loadDashboardData();
  else if (page === 'devices') loadDevices();
  else if (page === 'automation') loadAutomations();
  else if (page === 'finance') loadFinance();
  else if (page === 'ota') loadFirmware();
  else if (page === 'notifications') loadNotifications();
  else if (page === 'logs') loadLogs();
  else if (page === 'settings') loadSettings();
}

// ========== DASHBOARD PAGE ==========
function renderDashboard() {
  const d = state.dashboardData || mockDashboardData();
  const cards = d.cards || {};
  const chartData = d.charts?.[state.chartRange] || d.charts?.['24h'] || [];
  const relays = cards.relayStatus || [];
  
  return `
    <div class="fade-in space-y-6">
      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">แดชบอร์ด Smart Farm</h1>
          <p class="text-sm text-gray-500">อัพเดตล่าสุด: ${timeAgo(cards.lastUpdate)}</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex bg-gray-200 dark:bg-gray-700 rounded-lg p-1">
            ${['24h','7d','30d'].map(r => `
              <button onclick="state.chartRange='${r}';render()" class="px-3 py-1 rounded-md text-sm font-medium transition ${state.chartRange===r?'bg-farm text-white':'text-gray-600 dark:text-gray-300'}">${r}</button>
            `).join('')}
          </div>
          <div class="flex items-center gap-1 px-3 py-1 rounded-lg ${cards.onlineDevices>0?'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300':'bg-red-100 text-red-700'}">
            <span class="w-2 h-2 rounded-full ${cards.onlineDevices>0?'bg-green-500 pulse-dot':'bg-red-500'}"></span>
            <span class="text-xs font-medium">${cards.onlineDevices>0?'Online':'Offline'}</span>
          </div>
        </div>
      </div>

      <!-- Status Cards Grid -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4">
        ${renderStatCard('อุณหภูมิ', `${cards.temperature?.toFixed(1) || '0'}°C`, '🌡️', cards.temperature > 40 ? 'text-red-500' : 'text-farm')}
        ${renderStatCard('ความชื้น', `${(cards.humidity || 0).toFixed(1)}%`, '💧', 'text-farm-info')}
        ${renderStatCard('ความชื้นดิน', `${cards.soilMoisture || 0}`, '🌱', (cards.soilMoisture||0) < 30 ? 'text-red-500' : 'text-farm')}
        ${renderStatCard('แสง', `${(cards.light||0).toLocaleString()}`, '☀️', 'text-yellow-500')}
        ${renderStatCard('ระดับน้ำ', `${cards.waterLevel || 0}%`, '🚰', (cards.waterLevel||0) < 15 ? 'text-red-500' : 'text-farm-info')}
        ${renderStatCard('ฝน', cards.rain ? 'ตก' : 'ไม่ตก', '🌧️', cards.rain ? 'text-blue-500' : 'text-gray-400')}
        ${renderStatCard('แบตเตอรี่', `${cards.battery || 0}%`, '🔋', (cards.battery||0) < 20 ? 'text-red-500' : 'text-farm')}
      </div>

      <!-- Device Status + Relay Status -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <h3 class="font-semibold mb-3 flex items-center gap-2">📡 สถานะอุปกรณ์</h3>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-green-50 dark:bg-green-900/30 rounded-lg p-3">
              <div class="text-2xl font-bold text-green-600">${cards.onlineDevices || 0}</div>
              <div class="text-xs text-gray-500">Online</div>
            </div>
            <div class="bg-red-50 dark:bg-red-900/30 rounded-lg p-3">
              <div class="text-2xl font-bold text-red-500">${cards.offlineDevices || 0}</div>
              <div class="text-xs text-gray-500">Offline</div>
            </div>
            <div class="bg-blue-50 dark:bg-blue-900/30 rounded-lg p-3">
              <div class="text-2xl font-bold text-blue-500">${cards.totalDevices || 0}</div>
              <div class="text-xs text-gray-500">ทั้งหมด</div>
            </div>
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">
          <h3 class="font-semibold mb-3 flex items-center gap-2">🔌 สถานะรีเลย์</h3>
          <div class="space-y-2">
            ${relays.map(r => `
              <div class="flex items-center justify-between">
                <span class="text-sm capitalize">${r.name === 'pump' ? 'ปั๊มน้ำ' : r.name === 'zone1' ? 'โซน 1' : r.name === 'zone2' ? 'โซน 2' : r.name === 'light' ? 'ไฟ' : r.name}</span>
                <span class="px-3 py-1 rounded-full text-xs font-medium ${r.state ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-gray-100 text-gray-500 dark:bg-gray-700'}">
                  ${r.state ? 'เปิด' : 'ปิด'}
                </span>
              </div>
            `).join('') || '<div class="text-sm text-gray-400">ไม่มีข้อมูล</div>'}
          </div>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5 card-hover">

async function loadDashboardData() {
  const result = await apiCall('getDashboardData', 'GET');
  if (result.status === 'ok' && result.cards) {
    state.dashboardData = result;
  } else {
    state.dashboardData = mockDashboardData();
  }
  render();
  setTimeout(renderCharts, 100);
  
  // Auto refresh every 5 seconds
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(async () => {
    if (state.currentPage === 'dashboard') {
      const r = await apiCall('getDashboardData', 'GET');
      if (r.status === 'ok' && r.cards) state.dashboardData = r;
      else state.dashboardData = mockDashboardData();
      render();
      setTimeout(renderCharts, 50);
    }
  }, 5000);
}

function loadMap() {
  const devices = state.dashboardData?.devices || [];
  if (devices.length === 0) { $('#map').innerHTML = '<div class="text-gray-400">ไม่มีอุปกรณ์</div>'; return; }
  
  // Simple map using Google Maps embed or fallback to static
  const center = devices[0]?.location || { lat: 13.7563, lng: 100.5014 };
  const markers = devices.map(d => {
    const loc = d.location || center;
    return `${loc.lat},${loc.lng}`;
  }).join('&');
  
  // Use Google Maps embed (no API key needed for basic embed)
  $('#map').innerHTML = `
    <iframe width="100%" height="100%" style="border:0;border-radius:12px" 
      loading="lazy" allowfullscreen
      src="https://www.google.com/maps/embed/v1/place?q=${center.lat},${center.lng}&zoom=14&key=AIzaSyBFw0Qbyq9zTFAaLl1JlLQFMqED0UqLNJg">

  `;

async function controlDevice(deviceId, command) {
  if (!confirm(`สั่ง${command === 'restart' ? 'รีสตาร์ท' : command}อุปกรณ์ ${deviceId}?`)) return;
  toast(`สั่ง${command}อุปกรณ์...`, 'info');
  const result = await apiCall('deviceControl', 'POST', { deviceId, command });
  toast(result.status === 'ok' ? 'สำเร็จ!' : 'ล้มเหลว', result.status === 'ok' ? 'success' : 'error');
  loadDevices();
}

async function triggerOTA(deviceId) {
  if (!confirm(`เริ่ม OTA Update สำหรับ ${deviceId}?`)) return;
  toast('เริ่ม OTA Update...', 'info');
  const result = await apiCall('deviceOta', 'POST', { deviceId, action: 'trigger' });
  toast(result.status === 'ok' ? `OTA เริ่มแล้ว - v${result.firmware?.version}` : 'ล้มเหลว', result.status === 'ok' ? 'success' : 'error');
}

async function deleteDevice(id, name) {
  if (!confirm(`ลบอุปกรณ์ ${name}? ไม่สามารถย้อนกลับได้!`)) return;
  toast('กำลังลบ...', 'info');
  const result = await apiCall('deviceControl', 'POST', { deviceId: name, command: 'delete' });
  toast(result.status === 'ok' ? 'ลบแล้ว' : 'ล้มเหลว', result.status === 'ok' ? 'success' : 'error');
  loadDashboardData();
}

function registerNewDevice() {
  const name = prompt('ชื่ออุปกรณ์ใหม่:');
  if (!name) return;
  toast('สำเร็จ! อุปกรณ์จะลงทะเบียนอัตโนมัติเมื่อเชื่อมต่อ', 'info');
}

  const filter = $('#logFilter').value;
  if (!filter) { render(); return; }
  state.logs = state.logs.filter(l => l.type === filter);
  render();
}

// ========== SETTINGS PAGE ==========
function renderSettings() {
  const s = state.settings || {};
  return `

          <div><label class="font-medium">Database URL</label><input value="${s.firebaseConfig?.databaseURL || ''}" readonly class="w-full mt-1 px-3 py-2 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-xs"></div>
          <div><label class="font-medium">Project ID</label><input value="${s.firebaseConfig?.projectId || ''}" readonly class="w-full mt-1 px-3 py-2 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-xs"></div>
          <div><label class="font-medium">Storage Bucket</label><input value="${s.firebaseConfig?.storageBucket || ''}" readonly class="w-full mt-1 px-3 py-2 border-2 border-gray-200 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-xs"></div>

        </div>
      </div>

      <!-- ESP8266 API Key -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-5">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

          <div><label class="text-sm font-medium">ความชื้นดินต่ำ</label><input id="setLowSoil" type="number" value="${s.thresholds?.lowSoil || 30}" class="w-full mt-1 px-3 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700"></div>

async function loadSettings() {
  const result = await apiCall('settingsApi', 'GET');
  state.settings = result.settings || {};
  render();
}

async function saveSettings() {
  toast('กำลังบันทึก...', 'info');
  const data = {
    telegramBotToken: $('#setTgToken')?.value || '',
    telegramChatId: $('#setTgChatId')?.value || '',
    apiKey: $('#setApiKey')?.value || '',
    language: $('#setLang')?.value || 'th',
    timezone: $('#setTz')?.value || 'Asia/Bangkok',
    theme: $('#setTheme')?.value || 'light',
    thresholds: {
      highTemp: parseInt($('#setHighTemp')?.value || 40),
      lowSoil: parseInt($('#setLowSoil')?.value || 30),
      lowBattery: parseInt($('#setLowBat')?.value || 20),
      lowWaterLevel: parseInt($('#setLowWater')?.value || 15)
    }
  };
  await apiCall('settingsApi', 'POST', data);
  toast('บันทึกการตั้งค่าแล้ว!', 'success');
  if (data.theme !== state.theme) { state.theme = data.theme; applyTheme(); }
}

// ========== MAIN RENDER ==========
function render() {
  const app = $('#app');
  if (!state.user) {
    app.innerHTML = renderLogin();
    return;
  }

  let content = '';
  switch (state.currentPage) {
    case 'dashboard': content = renderDashboard(); break;
    case 'devices': content = renderDevices(); break;
    case 'automation': content = renderAutomation(); break;
    case 'finance': content = renderFinance(); break;
    case 'ota': content = renderOta(); break;
    case 'notifications': content = renderNotifications(); break;
    case 'logs': content = renderLogs(); break;
    case 'settings': content = renderSettings(); break;
    default: content = renderDashboard();
  }

  app.innerHTML = renderLayout(content);
  
  // Render charts after DOM is ready
  if (state.currentPage === 'dashboard') {
    setTimeout(renderCharts, 100);
  }
}

// ========== INIT ==========
function init() {
  // Load theme
  state.theme = localStorage.getItem('theme') || 'light';
  applyTheme();
  
  // Restore session
  const saved = localStorage.getItem('user') || sessionStorage.getItem('user');
  if (saved) {
    try { state.user = JSON.parse(saved); } catch(e) {}
  }
  
  render();
  
  if (state.user) {
    loadDashboardData();
  }
}

// Start
init();
</script>
</body>
</html>
